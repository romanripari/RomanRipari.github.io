<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eras</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;font-family:system-ui,sans-serif}
body{background:#efe9dd;color:#222}
header{background:#2d4a3e;color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding-top:calc(10px + env(safe-area-inset-top,0px))}
h1{font-size:18px;margin:0}
.chip{display:inline-block;background:#fff3;padding:3px 9px;border-radius:12px;margin:2px;font-size:12px}
main{padding:10px;max-width:1100px;margin:auto;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.stickytop{position:sticky;top:0;z-index:50}
.handdock{position:sticky;bottom:0;z-index:40;box-shadow:0 -6px 14px #0003;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.loseta{position:relative;background:#b9cbd6;border:2px solid #333;border-radius:10px;padding:6px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px;justify-content:space-around;box-shadow:0 2px 6px #0004}
.loseta.glow{box-shadow:0 0 0 3px #00b86b,0 0 14px #00b86b88}
.lg{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:3px;border-radius:6px;opacity:.45}
.lg.act{opacity:1;background:#fff9;outline:2px solid #e0007a}
.lg.pick{opacity:1;cursor:pointer;background:#d9f7e8;outline:3px solid #00b86b;box-shadow:0 0 10px #00b86b;animation:pulse 1.2s infinite}
.lg span{font-size:11px;font-weight:700;color:#111}
.lg .ico{font-size:26px;line-height:1.1}
.lg svg{height:30px;width:30px}
.street{background:#fff;border-radius:10px;padding:8px;margin-bottom:8px;box-shadow:0 1px 3px #0002}
.street.glow{box-shadow:0 0 0 3px #00b86b,0 0 14px #00b86b88}
.street.glowred{box-shadow:0 0 0 3px #e0302a,0 0 14px #e0302a88}
.street h3{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tot{font-weight:400;color:#555}
.row{display:flex;gap:10px;overflow-x:auto;padding:22px 4px 6px}
.bld{position:relative;flex:0 0 210px;height:230px;background:#fff;border:2px solid #444;border-radius:12px;display:flex;overflow:visible;font-size:11px}
.bld .caption{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#2d4a3e;color:#fff;font-size:12px;border-radius:8px;padding:6px 8px;white-space:normal;max-width:230px;z-index:200;pointer-events:none;box-shadow:0 2px 6px #0005}
.bld:hover .caption{display:block}
.bld .caption .c-izq{display:block;font-weight:700;margin-bottom:2px}
.bld .caption .c-der{display:block;margin-top:2px}
.bld.full{border-color:#00b86b;box-shadow:0 0 10px #00b86b}
.bld.act{outline:4px solid #e0007a}
.bld.sel{outline:4px solid #e0a000}
.bld.dsel{outline:4px solid #e0302a}
.bld.pwok{outline:3px dashed #00b86b;cursor:pointer}
.bld.hand{cursor:pointer}
.bld .main{flex:3 1 0;display:flex;flex-direction:column;min-width:0;padding:0}
.bld .top3{display:flex;justify-content:center;gap:8px;align-items:center;font-size:16px;height:26px;width:100%;padding:2px 4px;background:transparent}
.bld .mid{display:flex;align-items:center;gap:6px;flex:1}
.bld .labs{display:flex;flex-direction:column;gap:3px;font-size:10px;font-weight:700;color:#333;text-align:right;flex:1}
.bld .sqr{width:64px;height:64px;border:2px solid #444;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:38px;background:#f7f3ea}

/* Contenedor de slots adaptativo en filas */
.bld .need{display:flex;flex-direction:column;gap:3px;margin-top:6px;border-top:2px dashed #0006;padding-top:6px;align-items:center;justify-content:center}
.bld .need .ln{display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;width:100%}
.bld .need .sl{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;max-width:110px}

.bld .slot{display:inline-block;flex:0 0 14px;width:14px;height:14px;border:1.5px solid #444;border-radius:3px;background:#fff}
.bld .slot.on{background:#8a5a2b}
.bld .slot.mt.on{background:#7d8a96}
.bld .slot.st.on{background:#d97706}

/* Lado derecho con fondo blanco limpio */
.bld .strip{flex:1 1 0;min-width:0;width:auto;border-left:2px dashed #0006;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;font-size:10px;gap:4px}
.bld .strip .give-row{display:flex;align-items:center;gap:3px;font-weight:900;font-size:15px}
.bld .strip b{font-size:10px;line-height:1.1;word-break:break-word;color:#222;padding:2px 4px;border-radius:4px}
.bld .strip .targ-ico{padding:4px 8px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:22px}
.bld .strip .targ-ico svg{width:24px;height:24px}
.bld .ic{display:inline-block;width:22px;text-align:center;flex:0 0 22px}

/* Sello redondo */
.seal-ico{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:#d97706;color:#fff;border-radius:50%;font-size:10px;box-shadow:0 1px 3px #0004}

/* Colores de Eras y Estructuras */
.era-EA, .lg.era-EA{background:#fff4b0;border-radius:8px}
.era-EC, .lg.era-EC{background:#ffd9a6;border-radius:8px}
.era-EM, .lg.era-EM{background:#bfdcf5;border-radius:8px}

.est-ZB, .lg.est-ZB{background:#b1cda5;border-radius:8px}
.est-ZI, .lg.est-ZI{background:#ceae8e;border-radius:8px}
.est-ZR, .lg.est-ZR{background:#748393;border-radius:8px;color:#fff}
.lg.est-ZR span{color:#fff}

.bld .svg-ico svg{width:20px;height:20px}
.plus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:900;font-size:34px;text-shadow:0 0 4px #fff,0 0 8px #fff,0 2px 4px #0006;animation:floatup 1s ease-out forwards;pointer-events:none;z-index:30}
.plus.md{color:#f28c28}
.plus.mt{color:#b8c2cc}
.plus.st{color:#d97706}
@keyframes floatup{0%{opacity:0;transform:translateY(6px)}30%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
@keyframes pulse{50%{transform:scale(1.05)}}
.empty{color:#888;font-size:12px;align-self:center}
button{background:#2d4a3e;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;margin:3px}
button:disabled{opacity:.4;cursor:default}
button.alt{background:#8a6d00}
button.ghost{background:#5b7a6c}
button.danger{background:#e0302a}
button.glowbtn{box-shadow:0 0 0 3px #00b86b,0 0 12px #00b86b;animation:pulse 1.2s infinite}
.banner{background:#00b86b;color:#fff;font-weight:700;border-radius:8px;padding:8px 12px;margin-bottom:8px;text-align:center}
.banner button{background:#fff;color:#1d6b4a}
.panel{background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:0 1px 3px #0002}
.log{font-size:12px;max-height:160px;overflow-y:auto;line-height:1.5}
.infos{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.infos>.panel{flex:1 1 280px;min-width:0}
.log{max-height:110px!important}
.overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px;z-index:100}
.overlay .panel{max-width:460px;width:100%;max-height:92vh;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:4px;border-bottom:1px solid #0002;text-align:left}

/* menú de inicio */
.setup{background:linear-gradient(#bfe9fb 0%,#e9f8ff 60%,#fff6dc 100%);color:#3b2f2f;position:relative;min-height:100vh;padding:24px 16px 150px;display:flex;justify-content:center;overflow:hidden}
.setup::after{content:"";position:absolute;left:0;right:0;bottom:0;height:78px;background:repeating-linear-gradient(90deg,#b9b9b9 0 46px,#a7a7a7 46px 48px);border-top:10px solid #e4787a;box-shadow:inset 0 10px 0 #fff,inset 0 -6px 0 #7a7a7a}
.setup-wrap{display:flex;flex-wrap:wrap;gap:28px;max-width:1000px;width:100%;position:relative;z-index:1}
.setup-left{flex:1 1 380px;min-width:0}
.setup-left h2{color:#2d6b4f;font-size:52px;margin:14px 0 6px;text-shadow:3px 3px 0 #ffd66b}
.setup-left .proto{color:#e0007a;font-weight:700;font-size:14px}
.setup-left p{color:#4a3d36;font-size:17px;line-height:1.5}
.setup-left h4{margin:22px 0 6px;font-size:18px;color:#c2410c}
.setup-left ul{color:#5a4a3a;font-size:15px;line-height:1.55;padding-left:20px}
.setup-left a{color:#2d8a5a;font-size:16px;font-weight:700}
.setup-right{flex:1 1 380px;background:#fff;border:3px solid #ffd66b;border-radius:24px;box-shadow:0 8px 0 #f2b33d55;padding:18px}
.opt-label{font-size:12px;letter-spacing:1px;color:#8a5a2b;font-weight:700;margin:14px 0 6px;text-transform:uppercase}
.opt-desc{font-size:12px;color:#7a6a5a;margin:-2px 0 6px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:#fff8ea;color:#5a4a3a;border:2px solid #f2c46b;border-radius:14px;padding:10px 16px;margin:0;font-size:15px;font-weight:600}
.opt.on{background:#ff7a59;color:#fff;border-color:#e0553a;box-shadow:0 3px 0 #b8402a}
.setup-right input{width:100%;background:#fffdf6;color:#3b2f2f;border:2px solid #f2c46b;border-radius:14px;padding:14px;font-size:16px;margin-top:14px}
.start{width:100%;background:#2fb67c;color:#fff;font-size:19px;font-weight:800;padding:16px;border-radius:16px;margin-top:14px;box-shadow:0 5px 0 #1d8a5b}
.cfg-error{background:#e0302a;color:#fff;font-weight:700;border-radius:12px;padding:10px 12px;margin-top:14px;font-size:14px}
.bld .sec-top{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px;font-weight:700;font-size:12px}
.bld .sec-mid{flex:3 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.bld .sec-mid .sqr{width:58px;height:58px;font-size:32px}
.bld .tipo-nm{font-weight:700;font-size:12px}
.bld .sec-bot{flex:1.4 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px}
.bld .est-nm{font-weight:700;font-size:11px;padding:2px 8px;border-radius:6px}
.bld .need{margin-top:0;border-top:none;padding:0;border-bottom:none}
.bld .sec-top{justify-content:center}
.bld .labs{text-align:center}
.row:not(.handrow){gap:0}
.row:not(.handrow) .bld{margin-right:-52px}
.row:not(.handrow) .bld:last-child{margin-right:0}
.row .bld.hand{margin-right:10px!important}
.bld .caption{top:50%;bottom:auto;left:50%;transform:translate(-50%,-50%);width:190px;white-space:normal;text-align:center;font-size:11px;padding:8px 10px;z-index:60}
.bld .poder-nm{font-size:9px;line-height:1.15;text-align:center;color:#333;padding:0 4px}
</style>
</head>
<body>
<div class="stickytop"><header>
  <h1>Eras</h1>
  <div id="hdr"></div>
</header>
<div id="loseta"></div></div>
<main>
  <div id="app"></div>
</main>

<script>
/* ===== DATOS (45 cartas) ===== */
const DATA = [
[1,'EA','ZB','TI','MT','EC'],[2,'EA','ZB','TM','MD','EM'],[3,'EA','ZB','TT','MD','ZR'],[4,'EA','ZB','TP','MT','ZI'],[5,'EA','ZB','TC','MT','ZR'],
[6,'EA','ZI','TI','MD','ZB'],[7,'EA','ZI','TM','MT','TI'],[8,'EA','ZI','TT','MT','EM'],[9,'EA','ZI','TP','MD','TC'],[10,'EA','ZI','TC','MT','TT'],
[11,'EA','ZR','TI','MD','ZB'],[12,'EA','ZR','TM','MT','ZB'],[13,'EA','ZR','TT','MD','TI'],[14,'EA','ZR','TP','MD','EM'],[15,'EA','ZR','TC','MD','EC'],
[16,'EC','ZB','TI','MD','EA'],[17,'EC','ZB','TM','MT','TP'],[18,'EC','ZB','TT','MT','EM'],[19,'EC','ZB','TP','MT','TC'],[20,'EC','ZB','TC','MD','TM'],
[21,'EC','ZI','TI','MD','ZR'],[22,'EC','ZI','TM','MD','TT'],[23,'EC','ZI','TT','MD','TP'],[24,'EC','ZI','TP','MT','TI'],[25,'EC','ZI','TC','MT','EA'],
[26,'EC','ZR','TI','MT','TM'],[27,'EC','ZR','TM','MT','TI'],[28,'EC','ZR','TT','MD','ZB'],[29,'EC','ZR','TP','MD','TC'],[30,'EC','ZR','TC','MD','ZI'],
[31,'EM','ZB','TI','MT','TT'],[32,'EM','ZB','TM','MT','TP'],[33,'EM','ZB','TT','MT','TC'],[34,'EM','ZB','TP','MD','EA'],[35,'EM','ZB','TC','MT','EC'],
[36,'EM','ZI','TI','MD','TM'],[37,'EM','ZI','TM','MT','ZR'],[38,'EM','ZI','TT','MD','EC'],[39,'EM','ZI','TP','MD','TT'],[40,'EM','ZI','TC','MD','TP'],
[41,'EM','ZR','TI','MT','ZI'],[42,'EM','ZR','TM','MD','TC'],[43,'EM','ZR','TT','MT','EA'],[44,'EM','ZR','TP','MD','ZI'],[45,'EM','ZR','TC','MT','TM']
];
const ERAS = ['EA','EC','EM'];
const ERA_LBL = {EA:'Antigua',EC:'Colonial',EM:'Moderna'};
const ERA_ICON = {EA:'🏛️',EC:'🏘️',EM:'🏙️'};
const EST_LBL = {ZB:'Básico',ZI:'Intermedio',ZR:'Reforzado'};
const EST_SIZE = {ZB:'Pe',ZI:'Me',ZR:'Gr'};
const TIPO_LBL = {TI:'Iglesia',TM:'Mercado',TT:'Taller',TP:'Puerto',TC:'Castillo'};
const TIPO_ICON = {TI:'⛪',TM:'⚖️',TT:'🔧',TP:'⚓',TC:'🏰'};
// Poder al llenarse (modo Sellos). "destino" son los tipos que pueden recibir el efecto.
const PODER = {
  TI:{accion:'mover',  cantidad:2, destino:'cualquiera'},
  TM:{accion:'mover',  cantidad:1, destino:'cualquiera'},
  TT:{accion:'sumar',  cantidad:1, destino:['TP','TC']},
  TP:{accion:'sumar',  cantidad:1, destino:['TM','TI']},
  TC:{accion:'sumar',  cantidad:1, destino:['TT','TM']}
};
// Texto que se muestra al jugador
const PODER_TXT = {
  TI:`Mover 2 sellos entre tus edificios`,
  TM:`Mover 1 sello entre tus edificios`,
  TT:`+1 sello a ${TIPO_ICON.TP} Puerto o ${TIPO_ICON.TC} Castillo`,
  TP:`+1 sello a ${TIPO_ICON.TM} Mercado o ${TIPO_ICON.TI} Iglesia`,
  TC:`+1 sello a ${TIPO_ICON.TT} Taller o ${TIPO_ICON.TM} Mercado`
};
const PODER_RECURSOS = {
  TI:'Roba 1 y devuelve 1',
  TM:'Cambia 1 material de un edificio',
  TT:'+1 Metal',
  TP:'+1 Madera',
  TC:'+1 Metal o Madera'
};
function poderTxt(t){ return SETUP.mode==='sellos' ? PODER_TXT[t] : PODER_RECURSOS[t]; }
const MAT_LBL = {MD:'Madera',MT:'Metal'};
const MAT_ICON = {MD:'🪵',MT:'⚙️'};

const CAP = {ZB:{MD:3,MT:1,ST:4}, ZI:{MD:2,MT:2,ST:5}, ZR:{MD:1,MT:3,ST:7}};
const LBL = {...ERA_LBL,...EST_LBL,...TIPO_LBL};
const PLAYER_NAMES = ['Lucía','Ana','Patri','Sofía','Carla','Laura','Julián','Bruno','Lucho','Nahuel','Augusto','Ale','Joaco','Gonza','Quimey','Facu','Pepo','Fer','Lito','Caco','Alf','Leo'];
const SLOTS = [5,3,1];
const MANUAL = 'https://docs.google.com/document/d/1zihOBsNf2MCNUJAewKQNNPNmX6KyIMqNLaXGmAMazl8/edit?usp=sharing';

/* ===== ÍCONOS ===== */
const EST_COLOR = {ZB:'#4e8a3a', ZI:'#8b5a2b', ZR:'#5d6b7a'};
function sizeSVG(est){
  const col = EST_COLOR[est];
  const s = EST_SIZE[est];
  if(s==='Pe') return `<svg viewBox="0 0 24 24"><rect x="5" y="13" width="14" height="8" fill="${col}" stroke="#222"/></svg>`;
  if(s==='Me') return `<svg viewBox="0 0 24 24"><rect x="2" y="9" width="10" height="12" fill="${col}" stroke="#222"/><rect x="12" y="13" width="10" height="8" fill="${col}" stroke="#222"/></svg>`;
  return `<svg viewBox="0 0 24 24"><rect x="1" y="14" width="6" height="7" fill="${col}" stroke="#222"/><rect x="8" y="8" width="7" height="13" fill="${col}" stroke="#222"/><rect x="16" y="3" width="7" height="18" fill="${col}" stroke="#222"/></svg>`;
}
function estrSVG(est){ return `<span class="svg-ico">${sizeSVG(est)}</span>`; }
function iconFor(k){
  if(ERA_ICON[k]) return `<span class="ico">${ERA_ICON[k]}</span>`;
  if(TIPO_ICON[k]) return `<span class="ico">${TIPO_ICON[k]}</span>`;
  return estrSVG(k);
}

/* ===== ESTADO ===== */
let S = null;
let SETUP = {bots:3, hand:5, village:5, discard:false, completeSix:false, starter:'azar', name:'', mode:'sellos'};
let UID = 0;

function configError(){
  const players = SETUP.bots + 1;
  const need = players * (SETUP.hand - 1 + SETUP.village);
  if(need <= 45) return null;
  return `Con ${players} jugadores, mano de ${SETUP.hand} y villages de ${SETUP.village} hacen falta ${need} cartas, y el mazo tiene 45. Bajá la mano o el largo de village.`;
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function log(msg){ S.log.push(msg); }
function mkCard(row,owner){
  return {uid:++UID, row, id:row[0], era:row[1], est:row[2], tipo:row[3], mat:row[4], tgt:row[5], owner, md:0, mt:0, st:0, fired:false, act:false, plusTs:0};
}
function tableCards(){ return S.players.flatMap(p=>p.street); }

function isComplete(b){ 
  const c=CAP[b.est]; 
  if(SETUP.mode==='sellos') return b.st>=c.ST;
  return b.md===c.MD && b.mt===c.MT; 
}
function hasRoom(b,mat){ 
  const c=CAP[b.est]; 
  if(SETUP.mode==='sellos') return b.st<c.ST;
  return mat==='MD' ? b.md<c.MD : b.mt<c.MT; 
}
function matches(b,k){ return b.era===k || b.est===k || b.tipo===k; }
function elems(b){ 
  if(SETUP.mode==='sellos') return b.st;
  return b.md+b.mt; 
}
function scoreVal(b){ 
  let v = elems(b);
  if(SETUP.mode==='recursos' && SETUP.completeSix && isComplete(b)) v += 1;
  return v;
}
function countElems(p,k){ return p.street.filter(b=>matches(b,k)).reduce((s,b)=>s+scoreVal(b),0); }

function addMat(b,mat){
  if(!hasRoom(b,mat)) return false;
  if(SETUP.mode==='sellos'){
    b.st++;
    b.plusTs = Date.now();
    b.plusMat = 'ST';
  } else {
    if(mat==='MD') b.md++; else b.mt++;
    b.plusTs = Date.now();
    b.plusMat = mat;
  }
  if(isComplete(b) && !b.fired){ b.fired=true; S.pwQ.push({owner:b.owner, b}); }
  return true;
}
function removeMat(b,mat){ 
  if(SETUP.mode==='sellos'){ if(b.st>0) b.st--; }
  else { if(mat==='MD') b.md--; else b.mt--; }
}

function giveFrom(src){
  const matToGive = SETUP.mode==='sellos' ? 'ST' : src.mat;
  tableCards().forEach(b=>{ if(b!==src && matches(b,src.tgt)) addMat(b,matToGive); });
}

function drawCards(p,n){
  for(let i=0;i<n;i++){
    if(!S.deck.length && S.discard.length){
      S.deck = shuffle(S.discard.splice(0));
      log('Se mezcló el descarte y se armó un mazo nuevo.');
    }
    if(S.deck.length) p.hand.push(mkCard(S.deck.pop(),p));
  }
}
function discardFrom(p,card){ p.hand = p.hand.filter(c=>c!==card); S.discard.push(card.row); }
function discardCardToDeck(p,card){ p.hand = p.hand.filter(c=>c!==card); S.deck.push(card.row); S.deck = shuffle(S.deck); }

/* ===== PARTIDA ===== */
function newGame(){
  if(configError()) return;
  const n = SETUP.bots + 1;
  const names = shuffle(PLAYER_NAMES.slice()).slice(0,SETUP.bots);
  const starter = SETUP.starter==='yo' ? 0 : Math.floor(Math.random()*n);
  S = {
    n,
    players: [SETUP.name.trim()||'Vos', ...names].map((name,i)=>({name, human:i===0, street:[], hand:[]})),
    deck: shuffle(DATA.slice()), discard:[],
    round:1, totals:[], roundResults:[], start:starter,
    active:[], turn:1, totalTurns:5,
    pendingPick:false, pendingDiscard:false, discardSel:null, selCard:null,
    simQueue:[], simDone:false, animating:false,
    over:false, hideOverlay:false,
    pwQ:[], pw:null, afterPw:null,
    revealOrder:[], log:[]
  };
  S.totals = S.players.map(()=>0);
  S.players.forEach(p=>{ for(let i=0;i<SETUP.hand;i++) p.hand.push(mkCard(S.deck.pop(),p)); });
  beginRound();
}

function beginRound(){
  S.turn=1; S.over=false; S.hideOverlay=false; S.selCard=null; S.discardSel=null;
  S.pendingPick=false; S.pendingDiscard=false; S.animating=false;
  S.simQueue=[]; S.simDone=false; S.pwQ=[]; S.pw=null; S.afterPw=null;
  S.totalTurns = S.round===1 ? SETUP.village : SETUP.village - 2;
  S.active = [ERAS[S.round-1]];
  log(`— Ronda ${S.round}: puntúa ${ERA_LBL[S.active[0]]} —`);
  log(`Empieza ${S.players[S.start].name}.`);
  render();
}

/* ===== TURNO ===== */
function doTurn(uid){
  const picks = S.players.map(p => p.human ? p.hand.find(c=>c.uid===uid) : botPick(p));
  S.players.forEach((p,i)=>{ p.hand = p.hand.filter(c=>c!==picks[i]); p.street.push(picks[i]); });
  S.selCard = null;
  log(`— Turno ${S.turn}: ${S.players.map((p,i)=>`${p.name} bajó #${picks[i].id}`).join(' · ')}`);
  S.revealOrder = [...Array(S.n).keys()].map(k=>picks[(S.start+k)%S.n]);
  S.animating = true;
  render();
  setTimeout(()=>activateStep(0), 600);
}

function activateStep(i){
  if(!S) return;
  tableCards().forEach(b=>{ b.act=false; });
  if(i>=S.revealOrder.length){
    S.animating = false;
    runPowers(()=>afterPowers());
    return;
  }
  const src = S.revealOrder[i];
  src.act = true;
  giveFrom(src);
  render();
  setTimeout(()=>activateStep(i+1), 1000);
}

function afterPowers(){
  if(!S.simDone && S.players.some(p=>p.street.length>=3)){
    S.simDone = true;
    startSimPick();
    return;
  }
  finishTurn();
}

function runPowers(then){
  S.afterPw = then;
  while(S.pwQ.length){
    const it = S.pwQ.shift();
    if(!it.owner.human){ botPower(it.owner, it.b); continue; }
    if(startHumanPower(it.owner, it.b)){ render(); return; }
  }
  S.pw = null;
  const t = S.afterPw; S.afterPw = null;
  if(t) t();
}

function startHumanPower(o,b){
  const kind = b.tipo;
  if(SETUP.mode==='sellos'){
    const p = PODER[kind];
    if(!p) return false;
    if(p.accion==='mover'){
      if(!o.street.some(x=>x.st>0)) return false;
      S.pw = {owner:o, kind, stage: kind==='TI' ? 'src1' : 'src', cantidad:p.cantidad, hechos:0, b};
      return true;
    }
    // sumar: el destino son los tipos permitidos en PODER
    if(!o.street.some(x=>p.destino.includes(x.tipo) && hasRoom(x,'ST'))) return false;
    S.pw = {owner:o, kind, stage:'dest_target', allowed:p.destino, b};
    return true;
  }
  // Modo Dos Recursos
  if(kind==='TI'){
    drawCards(o,1);
    S.pw = {owner:o, kind, stage:'ret', b};
    return true;
  }
  if(kind==='TM'){
    if(!o.street.some(x=>x.md>0 || x.mt>0)) return false;
    S.pw = {owner:o, kind, stage:'src', b};
    return true;
  }
  if(kind==='TT' || kind==='TP'){
    const mat = kind==='TT' ? 'MT' : 'MD';
    if(!o.street.some(x=>hasRoom(x,mat))) return false;
    S.pw = {owner:o, kind, stage:'dst', mat, b};
    return true;
  }
  if(!o.street.some(x=>hasRoom(x,'MD') || hasRoom(x,'MT'))) return false;
  S.pw = {owner:o, kind, stage:'mat', b};
  return true;
}

function pwValid(b){
  const pw = S.pw;
  if(!pw || b.owner!==pw.owner) return false;
  if(SETUP.mode==='sellos'){
    if(pw.kind==='TI'){
      if(pw.stage==='src1' || pw.stage==='src2') return b.st>0;
      if(pw.stage==='dst1' || pw.stage==='dst2') return b!==pw.src && hasRoom(b,'ST');
    }
    if(pw.kind==='TM'){
      if(pw.stage==='src') return b.st>0;
      if(pw.stage==='dst') return b!==pw.src && hasRoom(b,'ST');
    }
    if(pw.stage==='dest_target'){
      return pw.allowed.includes(b.tipo) && hasRoom(b,'ST');
    }
    return false;
  } else {
    if(pw.stage==='src') return b.md>0 || b.mt>0;
    if(pw.stage==='dst'){
      if(pw.kind==='TM') return b!==pw.src && hasRoom(b,pw.mat);
      return hasRoom(b,pw.mat);
    }
    return false;
  }
}

function pwClick(b){
  const pw = S.pw;
  if(!pw || !pwValid(b)) return;
  if(SETUP.mode==='sellos'){
    if(pw.kind==='TM'){
      if(pw.stage==='src'){ pw.src = b; pw.stage = 'dst'; render(); return; }
      if(pw.stage==='dst'){
        pw.src.st--;
        addMat(b,'ST');
        log(`Mercado: moviste 1 sello de ${LBL[pw.src.tipo]} a ${LBL[b.tipo]}.`);
        finishPw();
        return;
      }
    }
    if(pw.kind==='TI'){
      if(pw.stage==='src1'){ pw.src = b; pw.stage = 'dst1'; render(); return; }
      if(pw.stage==='dst1'){
        pw.src.st--;
        addMat(b,'ST');
        log(`Iglesia (1/2): moviste 1 sello a ${LBL[b.tipo]}.`);
        if(!S.players[0].street.some(x=>x.st>0)){ finishPw(); return; }
        render();
        return;
      }
      if(pw.stage==='src2'){ pw.src = b; pw.stage = 'dst2'; render(); return; }
      if(pw.stage==='dst2'){
        pw.src.st--;
        addMat(b,'ST');
        log(`Iglesia (2/2): moviste 1 sello a ${LBL[b.tipo]}.`);
        finishPw();
        return;
      }
    }
    if(pw.stage==='dest_target'){
      addMat(b,'ST');
      log(`${LBL[pw.kind]}: sumaste 1 sello a ${LBL[b.tipo]}.`);
      finishPw();
      return;
    }
  } else {
    if(pw.stage==='src'){ pw.src = b; pw.stage = 'mat'; render(); return; }
    if(pw.stage==='dst'){
      if(pw.kind==='TM'){
        removeMat(pw.src, pw.mat);
        log(`Mercado: pasaste 1 ${MAT_LBL[pw.mat]} de ${LBL[pw.src.tipo]} a ${LBL[b.tipo]}.`);
      } else {
        log(`${LBL[pw.kind]}: sumaste 1 ${MAT_LBL[pw.mat]} a ${LBL[b.tipo]}.`);
      }
      addMat(b, pw.mat);
      finishPw();
    }
  }
}
function pwChooseMat(mat){
  const pw = S.pw;
  if(!pw || pw.stage!=='mat') return;
  pw.mat = mat;
  pw.stage = 'dst';
  render();
}

function finishPw(){
  const then = S.afterPw;
  S.pw = null;
  runPowers(then);
}

function botPower(o,b){
  const kind = b.tipo;
  if(SETUP.mode==='sellos'){
    const p = PODER[kind];
    if(!p) return;
    if(p.accion==='mover'){
      for(let i=0;i<p.cantidad;i++){
        const srcs = o.street.filter(x=>x.st>0);
        const dsts = o.street.filter(x=>hasRoom(x,'ST'));
        if(!srcs.length || !dsts.length) break;
        const s = srcs[0];
        const d = dsts.find(x=>x!==s);
        if(!d) break;
        s.st--;
        addMat(d,'ST');
      }
      return;
    }
    // sumar: +1 sello a un edificio de los tipos permitidos
    const targets = o.street.filter(x=>p.destino.includes(x.tipo) && hasRoom(x,'ST'));
    if(targets.length) addMat(targets[0],'ST');
    return;
  }
  // Modo Dos Recursos (sin cambios)
  if(kind==='TI'){
    drawCards(o,1);
    if(o.hand.length){
      const c = o.hand[Math.floor(Math.random()*o.hand.length)];
      discardCardToDeck(o,c);
    }
    return;
  }
  if(kind==='TM'){
    const srcs = o.street.filter(x=>x.md>0 || x.mt>0);
    if(!srcs.length) return;
    const src = srcs[Math.floor(Math.random()*srcs.length)];
    const mats = ['MD','MT'].filter(m=>(m==='MD'?src.md:src.mt)>0);
    const mat = mats[Math.floor(Math.random()*mats.length)];
    const dst = o.street.filter(x=>x!==src && hasRoom(x,mat));
    if(!dst.length) return;
    removeMat(src,mat);
    addMat(dst[Math.floor(Math.random()*dst.length)], mat);
    return;
  }
  if(kind==='TT' || kind==='TP'){
    const mat = kind==='TT' ? 'MT' : 'MD';
    const d = o.street.filter(x=>hasRoom(x,mat));
    if(d.length) addMat(d[Math.floor(Math.random()*d.length)], mat);
    return;
  }
  const opts = ['MD','MT'].filter(m=>o.street.some(x=>hasRoom(x,m)));
  if(!opts.length) return;
  const mat = opts[Math.floor(Math.random()*opts.length)];
  const d = o.street.filter(x=>hasRoom(x,mat));
  addMat(d[Math.floor(Math.random()*d.length)], mat);
}

/* ===== BOTS ===== */
function botPick(p){
  let best=null, bs=-1e9;
  p.hand.forEach(c=>{
    let v=0;
    tableCards().forEach(b=>{
      const matCheck = SETUP.mode==='sellos' ? 'ST' : c.mat;
      if(!matches(b,c.tgt) || !hasRoom(b,matCheck)) return;
      v += b.owner===p ? 2 : -1;
    });
    S.active.forEach(k=>{ if(matches(c,k)) v+=1.5; });
    v += Math.random()*0.3;
    if(v>bs){ bs=v; best=c; }
  });
  return best;
}
function botDiscard(p){
  let worst=null, wv=1e9;
  p.hand.forEach(c=>{
    const matCheck = SETUP.mode==='sellos' ? 'ST' : c.mat;
    const v = tableCards().filter(b=>matches(b,c.tgt) && hasRoom(b,matCheck)).length + Math.random()*0.2;
    if(v<wv){ wv=v; worst=c; }
  });
  return worst;
}
function botCrit(p){
  const cand = pickablePool();
  const val = k => countElems(p,k) - 0.7*Math.max(0,...S.players.filter(q=>q!==p).map(q=>countElems(q,k))) + Math.random()*0.5;
  return cand.sort((a,b)=>val(b)-val(a))[0];
}

/* ===== CRITERIOS EN EL TERCER TURNO ===== */
function pickablePool(){
  return [...Object.keys(EST_LBL), ...Object.keys(TIPO_LBL)].filter(k=>!S.active.includes(k));
}
function startSimPick(){
  S.simQueue = [...Array(S.n).keys()].map(i=>(S.start+i)%S.n);
  log('Cada jugador elige un criterio, en orden desde el jugador inicial.');
  runSimQueue();
}
function runSimQueue(){
  while(S.simQueue.length){
    const p = S.players[S.simQueue[0]];
    if(p.human){
      S.pendingPick = true;
      render();
      return;
    }
    const k = botCrit(p);
    S.active.push(k);
    S.simQueue.shift();
    log(`${p.name} elige el criterio ${LBL[k]}.`);
  }
  S.pendingPick = false;
  finishTurn();
}
function pickCriterion(k){
  if(!S.pendingPick || !pickablePool().includes(k)) return;
  S.active.push(k);
  S.simQueue.shift();
  S.pendingPick = false;
  log(`Criterio elegido: ${LBL[k]}.`);
  runSimQueue();
}

/* ===== FIN DE TURNO ===== */
function finishTurn(){
  S.start = (S.start+1) % S.n;
  if(!SETUP.discard){
    if(S.turn<S.totalTurns) S.players.forEach(p=>drawCards(p,1));
    completeTurn();
    return;
  }
  if(S.turn>=S.totalTurns){ completeTurn(); return; }
  S.players.filter(p=>!p.human).forEach(p=>{
    discardFrom(p, botDiscard(p));
    drawCards(p,2);
  });
  S.pendingDiscard = true;
  render();
}
function completeTurn(){
  S.pendingDiscard = false;
  S.turn++;
  if(S.turn>S.totalTurns) endRound(); else render();
}
function confirmDiscard(){
  const me = S.players[0];
  if(!S.pendingDiscard || !S.discardSel) return;
  discardFrom(me, S.discardSel);
  log(`Descartaste #${S.discardSel.id}.`);
  S.discardSel = null;
  drawCards(me,2);
  completeTurn();
}

/* ===== PUNTUACIÓN ===== */
function score(){
  const pts = S.players.map(()=>0);
  const lines = [];
  S.active.forEach(k=>{
    const vals = S.players.map((p,i)=>({i, v:countElems(p,k)}));
    vals.sort((a,b)=>b.v-a.v);
    let pos=0;
    while(pos<vals.length && vals[pos].v>0){
      let end=pos;
      while(end<vals.length && vals[end].v===vals[pos].v) end++;
      const group = vals.slice(pos,end);
      let sum=0;
      for(let q=pos;q<end && q<3;q++) sum+=SLOTS[q];
      const avg = Math.floor(sum/group.length);
      group.forEach(g=>pts[g.i]+=avg);
      lines.push({crit:k, group:group.map(g=>({name:S.players[g.i].name, v:g.v, pts:avg}))});
      pos=end;
    }
  });
  return {pts, lines};
}

function endRound(){
  S.over = true;
  S.hideOverlay = false;
  const res = score();
  res.pts.forEach((v,i)=>S.totals[i]+=v);
  S.roundResults.push(res);
  log(`Fin de la ronda ${S.round}.`);
  render();
}

function nextRound(){
  const kept = new Set();
  S.players.forEach(p=>{
    let n=0;
    for(let i=p.street.length-1;i>=0 && n<2;i--){
      const b = p.street[i];
      if(!isComplete(b) && elems(b)>=1){ kept.add(b); n++; }
    }
  });
  const back = [];
  S.players.forEach(p=>{
    p.street.forEach(b=>{ if(!kept.has(b)) back.push(b.row); });
    p.hand.forEach(c=>back.push(c.row));
    p.street = p.street.filter(b=>kept.has(b));
    p.hand = [];
  });
  S.deck = shuffle([...S.deck, ...S.discard, ...back]);
  S.discard = [];
  S.players.forEach(p=>{ for(let i=0;i<SETUP.hand;i++) p.hand.push(mkCard(S.deck.pop(),p)); });
  S.round++;
  beginRound();
}

/* ===== RENDER ===== */
function slotsHTML(b, hand){
  const c = CAP[b.est];
  if(SETUP.mode==='sellos'){
    const n = hand ? 0 : b.st;
    let total = c.ST; 
    let row1Count = total === 4 ? 2 : (total === 5 ? 3 : 4);
    let row2Count = total - row1Count;

    let r1 = '', r2 = '';
    for(let i=0; i<row1Count; i++){
      r1 += `<i class="slot st ${i<n?'on':''}"></i>`;
    }
    for(let i=0; i<row2Count; i++){
      let idx = row1Count + i;
      r2 += `<i class="slot st ${idx<n?'on':''}"></i>`;
    }
    return `<div class="ln"><span class="sl">${r1}</span></div><div class="ln"><span class="sl">${r2}</span></div>`;
  } else {
    let md = hand ? 0 : b.md;
    let mt = hand ? 0 : b.mt;
    let s1='';
    for(let i=0;i<c.MD;i++) s1+=`<i class="slot ${i<md?'on':''}"></i>`;
    let s2='';
    for(let i=0;i<c.MT;i++) s2+=`<i class="slot mt ${i<mt?'on':''}"></i>`;
    return `<div class="ln"><span class="ic">${MAT_ICON.MD}</span><span class="sl">${s1}</span></div>
            <div class="ln"><span class="ic">${MAT_ICON.MT}</span><span class="sl">${s2}</span></div>`;
  }
}

function bldInner(b, hand){
  const pl = (!hand && b.plusTs && Date.now()-b.plusTs<1000) ? `<div class="plus ${b.plusMat==='ST'?'st':(b.plusMat==='MD'?'md':'mt')}">+1</div>` : '';
  return `<div class="main">
    <div class="sec-top era-${b.era}"><span>${ERA_ICON[b.era]}</span><span>${ERA_LBL[b.era]}</span></div>
    <div class="sec-mid">
      <div class="tipo-nm">${LBL[b.tipo]}</div>
      <div class="sqr">${TIPO_ICON[b.tipo]}</div>
      <div class="poder-nm">${poderTxt(b.tipo)}</div>
    </div>
    <div class="sec-bot">
      <div class="est-nm est-${b.est}">${EST_LBL[b.est]}</div>
      <div class="need">${slotsHTML(b,hand)}</div>
    </div>
    ${pl}
  </div>`;
}
function stripHTML(c){
  const giveIcon = SETUP.mode==='sellos' ? `<span class="seal-ico">🏷️</span>` : MAT_ICON[c.mat];
  return `<div class="strip">
    <div class="give-row"><span>+</span>${giveIcon}</div>

    <b>${LBL[c.tgt]}</b>
  </div>`;
}
function captionHTML(b){
  return `<div class="caption">
    <span class="c-izq">${ERA_LBL[b.era]} / ${LBL[b.tipo]} / ${EST_LBL[b.est]}</span>
    <span class="c-der">Da ${SETUP.mode==='sellos' ? 'un sello' : MAT_LBL[b.mat]} a ${iconFor(b.tgt)} ${LBL[b.tgt]}</span>
    <span class="c-der">Si se llena: ${poderTxt(b.tipo)}</span>
  </div>`;
}
function bldHTML(b){
  const cls = ['bld', isComplete(b)?'full':'', b.act?'act':'', pwValid(b)?'pwok':''].join(' ');
  return `<div class="${cls}" data-card="${b.uid}">${captionHTML(b)}${bldInner(b,false)}${stripHTML(b)}</div>`;
}
function handCardHTML(c){
  const sel = (S.selCard===c?' sel':'') + (S.discardSel===c?' dsel':'');
  return `<div class="bld hand${sel}" data-card="${c.uid}">${captionHTML(c)}${bldInner(c,true)}${stripHTML(c)}</div>`;
}

function losetaHTML(){
  const pick = S && S.pendingPick ? pickablePool() : [];
  const item = k => {
    const isPick = pick.includes(k);
    const act = S && S.active.includes(k) ? ' act' : '';
    let extraCls = '';
    if(ERAS.includes(k)) extraCls = ` era-${k}`;
    if(k==='ZB') extraCls = ' est-ZB';
    if(k==='ZI') extraCls = ' est-ZI';
    if(k==='ZR') extraCls = ' est-ZR';

    return `<div class="lg${act}${isPick?' pick':''}${extraCls}" ${isPick?`data-crit="${k}"`:''}>${iconFor(k)}<span>${LBL[k]}</span></div>`;
  };
  return [...ERAS, ...Object.keys(EST_LBL), ...Object.keys(TIPO_LBL)].map(item).join('');
}

function pwBanner(){
  const pw = S.pw;
  let msg = '';
  if(SETUP.mode==='sellos'){
    if(pw.kind==='TI'){
      if(pw.stage==='src1') msg = 'Iglesia (1/2): Tocá un edificio propio con sellos para mover uno.';
      else if(pw.stage==='dst1') msg = 'Iglesia (1/2): Tocá el edificio de destino.';
      else if(pw.stage==='src2') msg = 'Iglesia (2/2): Tocá otro edificio con sellos para mover el segundo.';
      else if(pw.stage==='dst2') msg = 'Iglesia (2/2): Tocá el edificio de destino.';
    } else if(pw.kind==='TM'){
      if(pw.stage==='src') msg = 'Mercado: Tocá el edificio del que querés mover un sello.';
      else msg = 'Mercado: Tocá el edificio de destino.';
    } else if(pw.stage==='dest_target'){
      msg = `${LBL[pw.kind]}: Tocá el edificio válido (${pw.allowed.map(x=>LBL[x]).join(' o ')}) para sumarle 1 Sello.`;
    }
  } else {
    if(pw.kind==='TI') msg = 'Iglesia: tocá una carta de tu mano para devolverla al mazo (se mezcla).';
    else if(pw.kind==='TM'){
      if(pw.stage==='src') msg = 'Mercado: tocá el edificio del que sacás 1 material.';
      else if(pw.stage==='mat') msg = 'Mercado: elegí qué material sacás.';
      else msg = `Mercado: tocá el edificio al que lo llevás (${MAT_ICON[pw.mat]} ${MAT_LBL[pw.mat]}).`;
    }
    else if(pw.kind==='TT') msg = 'Taller: tocá un edificio tuyo para sumar 1 ⚙️ Metal.';
    else if(pw.kind==='TP') msg = 'Puerto: tocá un edificio tuyo para sumar 1 🪵 Madera.';
    else if(pw.kind==='TC'){
      msg = pw.stage==='mat' ? 'Castillo: elegí si sumás Madera o Metal.' : `Castillo: tocá un edificio tuyo para sumar 1 ${MAT_ICON[pw.mat]} ${MAT_LBL[pw.mat]}.`;
    }
  }
  let mats = '';
  const me = S.players[0];
  if(SETUP.mode!=='sellos' && (pw.kind==='TC' || pw.kind==='TM') && pw.stage==='mat'){

      const ok = pw.kind==='TC'
        ? me.street.some(x=>hasRoom(x,m))
        : (m==='MD' ? pw.src.md : pw.src.mt)>0 && me.street.some(x=>x!==pw.src && hasRoom(x,m));
      return `<button class="opt" data-pwmat="${m}" ${ok?'':'disabled'}>${MAT_ICON[m]} ${MAT_LBL[m]}</button>`;
    }).join('');
  }
  return `<div class="banner">${msg}<div>${mats}<button class="ghost" data-act="pwskip">Saltar poder</button></div></div>`;
}

function roundTableHTML(res){
  const rows = S.players.map((p,i)=>`<tr><td>${p.name}</td><td>${res.pts[i]}</td><td>${S.totals[i]}</td></tr>`).join('');
  const detail = res.lines.map(l=>`${LBL[l.crit]}: `+l.group.map(g=>`${g.name} (${g.v} el., +${g.pts})`).join(' · ')).join('<br>');
  return `<table><tr><th>Jugador</th><th>Ronda</th><th>Total</th></tr>${rows}</table>
    <h4>Detalle</h4><div class="log" style="max-height:none">${detail || 'Nadie puntuó.'}</div>`;
}

function liveHTML(){
  const res = score();
  const rows = S.active.map(k=>{
    const parts = res.lines.filter(l=>l.crit===k);
    return `<div><b>${LBL[k]}:</b> ${parts.length ? parts.map(l=>l.group.map(g=>`${g.name} (${g.v} el., +${g.pts})`).join(' · ')).join(' | ') : '<i>nadie puntúa aún</i>'}</div>`;
  }).join('');
  return `<div class="panel"><b>Puntuación en vivo (ronda ${S.round})</b><div class="log" style="max-height:none;margin-top:6px">${rows}</div></div>`;
}

function setupHTML(){
  const opt = (key,val,label) => `<button class="opt ${SETUP[key]===val?'on':''}" data-opt="${key}" data-val="${val}">${label}</button>`;
  const err = configError();
  return `<div class="setup"><div class="setup-wrap">
    <div class="setup-left">
      <div class="proto">UN PROTOTIPO DE BRUNO SASSONE Y ROMÁN RIPARI</div>
      <h2>Eras</h2>
      <p>Construí edificios en tu village a lo largo de tres eras y ganá la mayoría de materiales o sellos en los criterios de cada ronda.</p>
      <h4>Paso a paso</h4>
      <ul>
        <li>Cada turno, todos bajan una carta a la vez. Cada carta da un recurso o sello a los edificios de la mesa que cumplen con su "a quién".</li>
        <li>Si un edificio se completa, su poder se hace en el momento, una sola vez. Los poderes pueden encadenarse.</li>
        <li>Cuando alguien tiene 3 edificios, cada jugador elige un criterio nuevo (nunca una era).</li>
        <li>Al final de cada ronda puntúa la era de esa ronda, más los criterios elegidos.</li>
        <li>Entre rondas, conservás tus 2 últimos edificios con lugar libre y al menos un marcador.</li>
      </ul>
      <a href="${MANUAL}" target="_blank" rel="noopener">Ver el manual completo</a>
    </div>
    <div class="setup-right">
      ${err ? `<div class="cfg-error">${err}</div>` : ''}
      <div class="opt-label">Modo de juego</div>
      <div class="opts">${opt('mode','recursos','🪵⚙️ Dos Recursos')}${opt('mode','sellos','🏷️ Sellos de Influencia')}</div>
      <div class="opt-label">Jugar contra (bots)</div>
      <div class="opt-desc">Los bots siempre juegan en Difícil.</div>
      <div class="opts">${opt('bots',2,'2 bots (3 jugadores)')}${opt('bots',3,'3 bots (4 jugadores)')}${opt('bots',4,'4 bots (5 jugadores)')}</div>
      <div class="opt-label">Cartas en mano</div>
      <div class="opts">${[4,5,6].map(v=>`<button class="opt ${SETUP.hand===v?'on':''}" data-opt="hand" data-val="${v}">${v}</button>`).join('')}</div>
      <div class="opt-label">Largo de village</div>
      <div class="opts">${[5,6].map(v=>`<button class="opt ${SETUP.village===v?'on':''}" data-opt="village" data-val="${v}">${v}</button>`).join('')}</div>
      <div class="opt-label">Completados valen +1 (solo recursos)</div>
      <div class="opts">${opt('completeSix',true,'Sí')}${opt('completeSix',false,'No')}</div>
      <div class="opt-label">Modo descarte</div>
      <div class="opts">${opt('discard',true,'Sí')}${opt('discard',false,'No')}</div>
      <div class="opt-label">Empieza</div>
      <div class="opts">${opt('starter','azar','Al azar')}${opt('starter','yo','Yo')}</div>
      <input id="nm" placeholder="Tu nombre" value="${SETUP.name.replace(/"/g,'&quot;')}" maxlength="16">
      <button class="start" data-act="start" ${err?'disabled':''}>▷ Empezar partida</button>
    </div>
  </div></div>`;
}

function render(){
  const app = document.getElementById('app');
  const hdr = document.getElementById('hdr');
  const picking = !!S && !S.over && S.pendingPick;
  document.getElementById('loseta').innerHTML = `<div class="loseta${picking?' glow':''}">${losetaHTML()}</div>`;
  if(!S){
    hdr.innerHTML = '';
    app.innerHTML = setupHTML();
    const nm = document.getElementById('nm');
    if(nm) nm.addEventListener('input', e=>{ SETUP.name = e.target.value; });
    return;
  }
  hdr.innerHTML = `<span class="chip">Ronda ${S.round} / 3 · ${ERA_LBL[ERAS[S.round-1]]}</span>
    <span class="chip">Turno ${Math.min(S.turn,S.totalTurns)} / ${S.totalTurns}</span>
    <span class="chip">Mazo: ${S.deck.length}</span>
    <span class="chip">Inicial: ${S.players[S.start].name}</span>`;

  const me = S.players[0];
  const sc = score();
  let html = '';
  let handHTML = '';

  if(S.pw) html += pwBanner();
  else if(S.animating) html += `<div class="banner">Bajando cartas...</div>`;
  else if(S.pendingPick) html += `<div class="banner">Elegí un criterio: tocá un ícono verde de arriba</div>`;
  else if(S.pendingDiscard) html += `<div class="banner">Descartá una carta de tu mano: después robás 2</div>`;
  else if(!S.over && !S.selCard) html += `<div class="banner">Elegí una carta de tu mano</div>`;
  else if(!S.over) html += `<div class="banner">Bajá la carta elegida</div>`;

  S.players.forEach((p,i)=>{
    html += `<div class="street"><h3><span>${p.name}${p.human?' (vos)':''} · ${sc.pts[i]} pts</span><span class="tot">${p.street.length} edificios · ${p.street.reduce((s,b)=>s+elems(b),0)} ${SETUP.mode==='sellos'?'sellos':'materiales'}</span></h3>
      <div class="row">${p.street.length ? p.street.map(bldHTML).join('') : '<span class="empty">Sin edificios aún</span>'}</div></div>`;
  });

  if(!S.over){
    const needPlay = !S.pw && !S.animating && !S.pendingPick && !S.pendingDiscard;
    const glow = S.pendingDiscard ? ' glowred' : ((needPlay && !S.selCard) ? ' glow' : '');
    const head = S.pendingDiscard
      ? (S.discardSel ? `Elegida para descartar #${S.discardSel.id}` : 'Tocá la carta que querés descartar')
      : (S.selCard ? `Elegida #${S.selCard.id}` : 'Elegí una carta');
    handHTML = `<div class="street handdock${glow}"><h3><span>Tu mano</span><span>${head}</span></h3>
      <div class="row">${me.hand.map(handCardHTML).join('')}</div>
      <div>
        ${S.pendingDiscard ? `<button class="danger${S.discardSel?' glowbtn':''}" data-act="confirmDiscard" ${S.discardSel?'':'disabled'}>Confirmar descarte</button>` : ''}
        <button data-act="play" class="${needPlay && S.selCard ? 'glowbtn' : ''}" ${(!S.selCard || !needPlay)?'disabled':''}>Bajar carta</button>
      </div></div>`;
  } else {
    const res = S.roundResults[S.roundResults.length-1];
    const isLast = S.round>=3;
    html += `<div class="panel"><b>Ronda ${S.round} terminada</b><div style="margin-top:6px">
      <button class="ghost" data-act="showscore">Ver puntuación</button>
      ${isLast ? '<button data-act="new">Nueva partida</button>' : '<button data-act="nextround">Siguiente ronda</button>'}</div></div>`;
    if(!S.hideOverlay){
      html += `<div class="overlay"><div class="panel">
        <h3>${isLast ? 'Puntuación final' : `Ronda ${S.round} terminada`}</h3>
        ${roundTableHTML(res)}
        <div style="margin-top:8px">
          <button class="ghost" data-act="viewtable">Ver mesa</button>
          ${isLast ? '<button data-act="new">Nueva partida</button>' : '<button data-act="nextround">Siguiente ronda</button>'}
        </div></div></div>`;
    }
  }

  html += `<div class="infos">${!S.over ? liveHTML() : ''}<div class="panel"><b>Registro</b><div class="log" id="logbox">${S.log.slice(-40).map(l=>`<div>${l}</div>`).join('')}</div></div></div>`;
  app.innerHTML = html + handHTML;
  const logEl = document.getElementById('logbox');
  if(logEl) logEl.scrollTop = logEl.scrollHeight;
}

/* ===== EVENTOS ===== */
document.addEventListener('click', e=>{
  if(S && S.animating && e.target.closest('[data-card],[data-crit],[data-act="play"],[data-act="confirmDiscard"]')) return;

  const crit = e.target.closest('[data-crit]');
  if(crit && S && !S.over && S.pendingPick){ pickCriterion(crit.dataset.crit); return; }

  const opt = e.target.closest('[data-opt]');
  if(opt){
    const k = opt.dataset.opt;
    const raw = opt.dataset.val;
    let v;
    if(raw==='true') v=true; else if(raw==='false') v=false; else if(raw!=='' && !isNaN(raw)) v=+raw; else v=raw;
    SETUP[k] = v;
    render();
    return;
  }

  const pm = e.target.closest('[data-pwmat]');
  if(pm && S && S.pw){ pwChooseMat(pm.dataset.pwmat); return; }

  const act = e.target.closest('[data-act]');
  if(act){
    const a = act.dataset.act;
    if(a==='start'){ newGame(); return; }
    if(a==='new'){ S=null; render(); return; }
    if(!S) return;
    if(a==='viewtable'){ S.hideOverlay=true; render(); return; }
    if(a==='showscore'){ S.hideOverlay=false; render(); return; }
    if(a==='nextround'){ nextRound(); return; }
    if(S.over) return;
    if(a==='pwskip' && S.pw){ finishPw(); return; }
    if(a==='play' && S.selCard && !S.pw && !S.pendingPick && !S.pendingDiscard){ doTurn(S.selCard.uid); return; }
    if(a==='confirmDiscard'){ confirmDiscard(); return; }
  }

  const cardEl = e.target.closest('[data-card]');
  if(cardEl && S && !S.over){
    const uid = +cardEl.dataset.card;
    const me = S.players[0];
    if(S.pw){
      if(SETUP.mode!=='sellos' && S.pw.kind==='TI' && S.pw.stage==='ret'){
        const c = me.hand.find(x=>x.uid===uid);
        if(c){ discardCardToDeck(me,c); log(`Iglesia: devolviste #${c.id} al mazo y lo mezclaste.`); finishPw(); }
        return;
      }
      const b = me.street.find(x=>x.uid===uid);
      if(b) pwClick(b);
      return;
    }
    if(S.animating || S.pendingPick) return;
    if(S.pendingDiscard){
      const dc = me.hand.find(x=>x.uid===uid);
      if(dc){ S.discardSel = dc; render(); }
      return;
    }
    const hc = me.hand.find(x=>x.uid===uid);
    if(hc){ S.selCard = hc; render(); }
  }
});

render();
</script>
</body>
</html>
