<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paseo Comercial v2</title>
<style>
:root{--w:130px}
*{box-sizing:border-box}
html,body{margin:0;font-family:system-ui,sans-serif}
body{background:#efe9dd;color:#222}
header{background:#2d4a3e;color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding-top:calc(10px + env(safe-area-inset-top,0px))}
h1{font-size:18px;margin:0}
.chip{display:inline-block;background:#fff3;padding:3px 9px;border-radius:12px;margin:2px;font-size:12px}
main{padding:10px;max-width:1100px;margin:auto;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.stickytop{position:sticky;top:0;z-index:50}
.street.handdock{position:sticky;bottom:0;z-index:40;box-shadow:0 -6px 14px #0003;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.log{max-height:110px!important}
.infos{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.infos>.panel{flex:1 1 280px;min-width:0}
.loseta{position:relative;background:#b9cbd6;border:2px solid #333;border-radius:10px;padding:6px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px;justify-content:space-around;box-shadow:0 2px 6px #0004}
.loseta.glow{box-shadow:0 0 0 3px #00b86b,0 0 14px #00b86b88}
.lg{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:3px;border-radius:6px;opacity:.4}
.lg.act{opacity:1;background:#fff9;outline:2px solid #e0007a}
.lg.pick{opacity:1;cursor:pointer;background:#d9f7e8;outline:3px solid #00b86b;box-shadow:0 0 10px #00b86b;animation:pulse 1.2s infinite}
.lg span{font-size:11px;font-weight:700;color:#111}
.lg img{height:34px;width:auto}
.street{background:#fff;border-radius:10px;padding:8px;margin-bottom:8px;box-shadow:0 1px 3px #0002}
.street.glow{box-shadow:0 0 0 3px #00b86b,0 0 14px #00b86b88}
.street.glowred{box-shadow:0 0 0 3px #e0302a,0 0 14px #e0302a88}
.street h3{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tot{font-weight:400;color:#555}
.row{display:flex;overflow-x:auto;min-height:calc(var(--w) * 1.391 + 12px);padding:6px 4px 4px 4px}
/* La carta conserva sus esquinas originales. El solapado corta sobre la línea divisoria del arte (≈68 % del ancho). */
.card{position:relative;flex:0 0 var(--w);width:var(--w);height:calc(var(--w) * 1.391);margin-right:calc(var(--w) * -0.319)}
.card:last-child{margin-right:0}
.handrow .card{margin-right:10px}
.card img.art{display:block;width:100%;height:100%}
.card.sel{outline:4px solid #e0a000}
.card.dsel{outline:4px solid #e0302a}
.card.ext{outline:3px dashed #e0007a;cursor:pointer}
.card.hand{cursor:pointer}
.card.bonusmark{box-shadow:0 0 0 3px #00b86b,0 0 10px #00b86b}
.card.bonus{box-shadow:inset 0 0 0 4px #00b86b;cursor:pointer}
/* Clientes: se ubican sobre los círculos del arte, según el tamaño del edificio */
.dot{position:absolute;width:calc(var(--w) * 0.1);height:calc(var(--w) * 0.1);border-radius:50%;transform:translate(-50%,-50%);border:1.5px solid #e0007a;background:#fff8}
.dot.on{background:#e0007a}
.angry{position:absolute;top:6px;left:44%;background:#e0302a;color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:0 5px}
.empty{color:#888;font-size:12px;align-self:center}
button{background:#2d4a3e;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;margin:3px}
button:disabled{opacity:.4;cursor:default}
button.alt{background:#8a6d00}
button.ghost{background:#5b7a6c}
button.danger{background:#e0302a}
button.glowbtn{box-shadow:0 0 0 3px #00b86b,0 0 12px #00b86b;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.banner{background:#00b86b;color:#fff;font-weight:700;border-radius:8px;padding:8px 12px;margin-bottom:8px;text-align:center}
.panel{background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:0 1px 3px #0002}
.log{font-size:12px;max-height:160px;overflow-y:auto;line-height:1.5}
.overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px;z-index:100}
.overlay .panel{max-width:460px;width:100%;max-height:92vh;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:4px;border-bottom:1px solid #0002;text-align:left}

/* menú de inicio */
.setup{background:linear-gradient(#bfe9fb 0%,#e9f8ff 60%,#fff6dc 100%);color:#3b2f2f;position:relative;min-height:100vh;padding:24px 16px 150px;display:flex;justify-content:center;overflow:hidden}
.setup::after{content:"";position:absolute;left:0;right:0;bottom:0;height:78px;background:repeating-linear-gradient(90deg,#b9b9b9 0 46px,#a7a7a7 46px 48px);border-top:10px solid #e4787a;box-shadow:inset 0 10px 0 #fff,inset 0 -6px 0 #7a7a7a}
.setup-wrap{display:flex;flex-wrap:wrap;gap:28px;max-width:1000px;width:100%;position:relative;z-index:1}
.setup-left{flex:1 1 380px;min-width:0}
.setup-left h2{color:#2d6b4f;font-size:52px;margin:14px 0 6px;text-shadow:3px 3px 0 #ffd66b}
.setup-left .proto{color:#e0007a;font-weight:700;font-size:14px}
.setup-left p{color:#4a3d36;font-size:17px;line-height:1.5}
.setup-left h4{margin:22px 0 6px;font-size:18px;color:#c2410c}
.setup-left ul{color:#5a4a3a;font-size:15px;line-height:1.55;padding-left:20px}
.setup-left a{color:#2d8a5a;font-size:16px;font-weight:700}
.setup-right{flex:1 1 380px;background:#fff;border:3px solid #ffd66b;border-radius:24px;box-shadow:0 8px 0 #f2b33d55;padding:18px}
.opt-label{font-size:12px;letter-spacing:1px;color:#8a5a2b;font-weight:700;margin:14px 0 6px;text-transform:uppercase}
.opt-desc{font-size:12px;color:#7a6a5a;margin:-2px 0 6px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:#fff8ea;color:#5a4a3a;border:2px solid #f2c46b;border-radius:14px;padding:10px 16px;margin:0;font-size:15px;font-weight:600}
.opt.on{background:#ff7a59;color:#fff;border-color:#e0553a;box-shadow:0 3px 0 #b8402a}
.setup-right input{width:100%;background:#fffdf6;color:#3b2f2f;border:2px solid #f2c46b;border-radius:14px;padding:14px;font-size:16px;margin-top:14px}
.start{width:100%;background:#2fb67c;color:#fff;font-size:19px;font-weight:800;padding:16px;border-radius:16px;margin-top:14px;box-shadow:0 5px 0 #1d8a5b}
</style>
</head>
<body>
<div class="stickytop"><header>
  <h1>Paseo Comercial</h1>
  <div id="hdr"></div>
</header>
<div id="loseta"></div></div>
<main>
  <div id="app"></div>
</main>

<script>
/* ===== DATOS (45 cartas) ===== */
// [id, horario, rubro, tamaño, otorga a]
// Horarios: Ma, Ta, No · Rubros: Ba, Co, El, Ju, Ro · Tamaños: Pe, Me, Gr
const DATA = [
[1,'Ma','Ba','Gr','No'],[2,'No','Ba','Gr','Pe'],[3,'Ta','Ba','Gr','Ju'],
[4,'Ma','Ba','Me','Ta'],[5,'No','Ba','Me','Co'],[6,'Ta','Ba','Me','No'],
[7,'Ma','Ba','Pe','Ju'],[8,'No','Ba','Pe','Me'],[9,'Ta','Ba','Pe','Ro'],
[10,'Ma','Co','Gr','Pe'],[11,'No','Co','Gr','Ma'],[12,'Ta','Co','Gr','Me'],
[13,'Ma','Co','Me','Pe'],[14,'No','Co','Me','Ba'],[15,'Ta','Co','Me','El'],
[16,'Ma','Co','Pe','Gr'],[17,'No','Co','Pe','Ta'],[18,'Ta','Co','Pe','Gr'],
[19,'Ma','El','Gr','Ta'],[20,'No','El','Gr','Me'],[21,'Ta','El','Gr','Co'],
[22,'Ma','El','Me','Gr'],[23,'No','El','Me','Ta'],[24,'Ta','El','Me','Ma'],
[25,'Ma','El','Pe','No'],[26,'No','El','Pe','Gr'],[27,'Ta','El','Pe','Ma'],
[28,'Ma','Ju','Gr','Ba'],[29,'No','Ju','Gr','Ta'],[30,'Ta','Ju','Gr','Ro'],
[31,'Ma','Ju','Me','No'],[32,'No','Ju','Me','Ma'],[33,'Ta','Ju','Me','Pe'],
[34,'Ma','Ju','Pe','Ro'],[35,'No','Ju','Pe','Co'],[36,'Ta','Ju','Pe','No'],
[37,'Ma','Ro','Gr','Me'],[38,'No','Ro','Gr','El'],[39,'Ta','Ro','Gr','Ma'],
[40,'Ma','Ro','Me','Ju'],[41,'No','Ro','Me','Pe'],[42,'Ta','Ro','Me','Gr'],
[43,'Ma','Ro','Pe','Ba'],[44,'No','Ro','Pe','El'],[45,'Ta','Ro','Pe','Me']
];
const NAMES = ['Lucía','Ana','Patri','Sofía','Carla','Laura','Julián','Bruno','Lucho','Nahuel','Augusto','Ale','Joaco','Gonza','Quimey','Facu','Pepo','Fer','Lito','Caco','Alf','Leo'];
const POOL = ['Pe','Me','Gr','Ma','Ta','No','Ba','Co','El','Ju','Ro'];
const HORARIOS = ['Ma','Ta','No'];
const LBL = {_TOT:'Bonus de Clientela',Ma:'Mañana',Ta:'Tarde',No:'Noche',Pe:'Pequeño',Me:'Mediano',Gr:'Grande',Ba:'Bazar',Co:'Comida',El:'Electrónica',Ju:'Juguetería',Ro:'Ropa'};
const CAP3 = {Pe:3,Me:4,Gr:5};
const CAP4 = {Pe:4,Me:5,Gr:6};
const SLOTS = [5,3,1];
const MANUAL = 'https://docs.google.com/document/d/1zihOBsNf2MCNUJAewKQNNPNmX6KyIMqNLaXGmAMazl8/edit?usp=sharing';

/* ===== ARTE: cartas e íconos desde la carpeta Cartas/ ===== */
// Carta: inicial horario + inicial rubro + inicial tamaño. Ej.: trp.png = tarde, ropa, pequeño. Comida = c.
const TM = {Ma:'m',Ta:'t',No:'n'};
const RB = {Ba:'b',Ju:'j',Ro:'r',El:'e',Co:'c'};
const SZ = {Pe:'p',Me:'m',Gr:'g'};
function cardSrc(c){ return `Cartas/${TM[c.t]}${RB[c.r]}${SZ[c.s]}.png`; }
// Íconos: "ico_" + 3 primeras letras
const ICO = {Ma:'ico_man',Ta:'ico_tar',No:'ico_noc',Pe:'ico_peq',Me:'ico_med',Gr:'ico_gra',Ba:'ico_baz',Co:'ico_com',El:'ico_ele',Ju:'ico_jug',Ro:'ico_rop'};
function iconImg(code){ return `<img src="Cartas/${ICO[code]}.png" alt="${LBL[code]}">`; }

// Círculos de cliente en el arte (porcentaje del ancho y alto de la carta)
const SLOTS_ART = {
  Pe:[[22.3,80.8],[41.8,80.8],[32.2,91.6],[51.4,91.6],[61.3,91.6]],
  Me:[[23.9,80.8],[43.3,80.8],[14.7,91.6],[33.7,91.6],[52.8,91.6]],
  Gr:[[11.4,81.0],[30.5,81.3],[49.2,81.0],[20.3,92.1],[39.3,92.3],[58.3,92.5]]
};

/* ===== ESTADO ===== */
let S = null;
let SETUP = {rivals:3, diff:'dificil', starter:'azar', live:true, fullPenalty:false, chainBonus:true, inaug:false, extraClients:true, simPick:true, critMode:'horario', rounds:3, name:''};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function has(c,k){return c.t===k||c.r===k||c.s===k}
// 3, 4 y 5 jugadores: 4/5/6.
function capOf(c){ return CAP4[c.s]; }
// Mano según jugadores: 5 con 3 o 4 jugadores, 4 con 5 jugadores
function handSize(){ return S.n===5 ? 4 : 5; }
// Turnos de la primera ronda: 6 con 3 jugadores, 5 con 4 o 5
function firstRoundTurns(){ return S.n===3 ? 6 : 5; }
function tableCards(){return S.players.flatMap(p=>p.street)}
function totalClients(p){return p.street.reduce((s,c)=>s+c.clients,0)}
function lastPickTurn(){return S.n>=4 ? 4 : 3}
function log(msg){S.log.push(msg)}
function mkCard(d,owner){return {id:d[0],t:d[1],r:d[2],s:d[3],tgt:d[4],owner,clients:0}}
function rowOf(id){return DATA.find(d=>d[0]===id)}

function newGame(){
  const n = SETUP.rivals + 1;
  const botNames = shuffle(NAMES.slice()).slice(0,SETUP.rivals);
  const myName = SETUP.name.trim() || 'Vos';
  const starter = SETUP.starter==='yo' ? 0 : Math.floor(Math.random()*n);
  S = {
    n,
    players: [myName, ...botNames].map((name,i)=>({name,human:i===0,street:[],hand:[],extras:0})),
    deck: shuffle(DATA.slice()),
    discard: [],
    active: [], turn:1, totalTurns:5, start: starter,
    round:1, rounds: SETUP.rounds, totalPts: [], roundResults: [],
    pendingPick:false, prePick:false, pendingDiscard:false, extraMode:false, selCard:null, discardSel:null, front:null,
    simQueue:[], simDone:false,
    over:false, hideOverlay:false, live: SETUP.live, diff: SETUP.diff,
    fullPenalty: SETUP.fullPenalty, inaug: SETUP.inaug && !SETUP.simPick, extraClients: SETUP.extraClients, simPick: SETUP.simPick, critMode: SETUP.critMode, chain: SETUP.chainBonus, newFull:[], bonusQ:[], pendingBonus:null, afterBonus:null, log:[]
  };
  S.totalPts = S.players.map(()=>0);
  S.players.forEach(p=>{for(let i=0;i<handSize();i++) p.hand.push(mkCard(S.deck.pop(),p))});
  beginRound();
}

function beginRound(){
  S.turn=1; S.over=false; S.hideOverlay=false; S.selCard=null; S.discardSel=null; S.extraMode=false;
  S.pendingPick=false; S.prePick=false; S.pendingDiscard=false;
  S.simQueue=[]; S.simDone=false;
  S.players.forEach(p=>p.extras=0);
  S.totalTurns = S.round===1 ? firstRoundTurns() : firstRoundTurns() - 2;
  S.active = S.critMode==='horario' ? [HORARIOS[S.round-1]] : shuffle(POOL.slice()).slice(0,2);
  log(`— Ronda ${S.round} —`);
  log(`Criterios iniciales: ${S.active.map(x=>LBL[x]).join(', ')}.`);
  log(`Empieza ${S.players[S.start].name}.`);
  if(S.round>1 && S.n>=4 && !S.simPick){
    const st = S.players[S.start];
    if(st.human){ S.prePick=true; render(); return; }
    const c = botCrit(st);
    S.active.push(c);
    log(`${st.name} elige el criterio ${LBL[c]} antes de empezar.`);
  }
  render();
}

/* ===== MAZO Y DESCARTE ===== */
function drawCards(p,n){
  for(let i=0;i<n;i++){
    if(!S.deck.length && S.discard.length){
      S.deck = shuffle(S.discard.splice(0));
      log('Se acabó el mazo: se mezcló el descarte y se armó un mazo nuevo.');
    }
    if(S.deck.length) p.hand.push(mkCard(S.deck.pop(),p));
  }
}
function discardFrom(p,card){
  p.hand = p.hand.filter(c=>c!==card);
  S.discard.push(rowOf(card.id));
}
function completeTurn(){
  S.pendingDiscard=false;
  S.turn++;
  if(S.turn>S.totalTurns) endRound(); else render();
}
function confirmDiscard(){
  const me = S.players[0];
  if(!S.pendingDiscard || !S.discardSel) return;
  discardFrom(me, S.discardSel);
  log(`Descartaste #${S.discardSel.id}.`);
  S.discardSel = null;
  drawCards(me,2);
  completeTurn();
}

/* ===== MECÁNICA ===== */
function giveClients(src){
  tableCards().forEach(x=>{
    if(x===src || !has(x,src.tgt)) return;
    if(x.clients<capOf(x)){ x.clients++; if(x.clients===capOf(x)) S.newFull.push(x); }
    else if(S.fullPenalty && x.clients>0){ x.clients--; x.angry=true; log(`Cliente enojado: a un local de ${x.owner.name} se le restó uno.`); }
  });
}

/* ===== CLIENTES EN CADENA ===== */
// Un edificio Pequeño o Mediano lleno da un cliente extra a otro edificio del mismo rubro de la misma vereda (de cualquier tamaño). Los Grandes no disparan.
function bonusTargets(owner, src){
  return owner.street.filter(c=>c!==src && c.r===src.r && c.clients<capOf(c));
}
function isBonusTarget(c){
  return !!S.pendingBonus && bonusTargets(S.pendingBonus.owner, S.pendingBonus.src).includes(c);
}
function queueNewFull(){
  const list = S.newFull; S.newFull = [];
  list.forEach(src=>{
    if(!S.chain || src.s==='Gr') return;
    if(!bonusTargets(src.owner, src).length) return;
    src.bonusMark = true;
    S.bonusQ.push({owner: src.owner, src});
  });
}
function applyBonusTo(target){
  target.clients++;
  if(target.clients===capOf(target)) S.newFull.push(target);
}
function runBonuses(then){
  queueNewFull();
  while(S.bonusQ.length){
    const item = S.bonusQ[0];
    const t = bonusTargets(item.owner, item.src);
    if(!t.length){ S.bonusQ.shift(); continue; }
    if(item.owner.human){
      S.pendingBonus = item; S.afterBonus = then; render(); return;
    }
    S.bonusQ.shift();
    const pick = S.diff==='facil' ? t[Math.floor(Math.random()*t.length)]
      : t.slice().sort((a,b)=>S.active.filter(x=>has(b,x)).length - S.active.filter(x=>has(a,x)).length)[0];
    applyBonusTo(pick);
    log(`Clientes en cadena: ${item.owner.name} suma un cliente a un ${LBL[pick.s]} de ${LBL[pick.r]}.`);
    queueNewFull();
  }
  S.pendingBonus = null; S.afterBonus = null;
  if(then) then();
}
function chooseBonus(target){
  const item = S.pendingBonus;
  if(!item || !isBonusTarget(target)) return;
  applyBonusTo(target);
  log(`Clientes en cadena: sumaste un cliente a tu ${LBL[target.s]} de ${LBL[target.r]}.`);
  S.bonusQ.shift();
  S.pendingBonus = null;
  const then = S.afterBonus; S.afterBonus = null;
  runBonuses(then);
}

// Fácil: ve solo su mano y juega al azar.
// Difícil: cuenta cartas visibles, evita darles clientes a los rivales y prioriza criterios activos.
function botPick(p){
  if(S.diff==='facil') return p.hand[Math.floor(Math.random()*p.hand.length)];
  let best=null, bs=-1e9;
  p.hand.forEach(c=>{
    let v=0;
    tableCards().forEach(x=>{
      if(x===c || !has(x,c.tgt) || x.clients>=capOf(x)) return;
      v += (x.owner===p ? 2 : -rivalThreat(x.owner));
    });
    S.active.forEach(a=>{ if(has(c,a)) v+=1.5 });
    v += Math.random()*0.3;
    if(v>bs){bs=v;best=c}
  });
  return best;
}

// Bot: qué carta descartar. Fácil al azar; difícil, la que menos sirve.
function botDiscard(p){
  if(S.diff==='facil') return p.hand[Math.floor(Math.random()*p.hand.length)];
  let worst=null, wv=1e9;
  p.hand.forEach(c=>{
    let v=0;
    S.active.forEach(a=>{ if(has(c,a)) v+=1; });
    tableCards().forEach(x=>{ if(x.owner===p && has(x,c.tgt) && x.clients<capOf(x)) v+=0.5; });
    v+=Math.random()*0.2;
    if(v<wv){wv=v; worst=c;}
  });
  return worst;
}

// Criterios que se pueden elegir (en Por Horario no se eligen horarios)
function pickablePool(){
  return POOL.filter(x=>!S.active.includes(x) && !(S.critMode==='horario' && HORARIOS.includes(x)));
}
function countOwn(p,crit){return p.street.filter(c=>has(c,crit)).length}
function totOf(q,k){ return k==='_TOT' ? totalClients(q) : q.street.filter(c=>has(c,k)).reduce((s,c)=>s+c.clients,0); }
// cuántos criterios activos (incluido el bonus) lidera hoy este jugador
function leadsCount(q){
  const keys=[...S.active,...(S.extraClients?['_TOT']:[])];
  return keys.filter(k=>{ const mine=totOf(q,k); return mine>0 && S.players.every(o=>o===q || totOf(o,k)<mine); }).length;
}
// amenaza de un rival: crece si va primero en varios criterios
function rivalThreat(q){ return 0.6 + 0.5*leadsCount(q); }
// valor de un criterio para el bot: lo que tiene él menos lo que tiene el mejor rival
function critValue(p,crit){
  const rivals=S.players.filter(q=>q!==p).map(q=>countOwn(q,crit));
  return countOwn(p,crit) - 0.7*Math.max(0,...rivals);
}

function botCrit(p){
  const cand = pickablePool();
  if(S.diff==='facil') return cand[Math.floor(Math.random()*cand.length)];
  cand.sort((a,b)=> (critValue(p,b)-critValue(p,a)) + (Math.random()-0.5));
  return cand[0];
}

function botExtras(p){
  while(p.extras>0){
    const opts = p.street.filter(c=>c.clients<capOf(c));
    if(!opts.length) break;
    if(S.diff==='dificil') opts.sort((a,b)=> S.active.filter(x=>has(b,x)).length - S.active.filter(x=>has(a,x)).length);
    opts[S.diff==='facil' ? Math.floor(Math.random()*opts.length) : 0].clients++;
    p.extras--;
  }
  p.extras=0;
}

function doTurn(humanId){
  const picks = S.players.map(p => p.human ? p.hand.find(c=>c.id===humanId) : botPick(p));
  S.players.forEach((p,i)=>{
    p.hand = p.hand.filter(c=>c!==picks[i]);
    p.street.push(picks[i]);
  });
  log(`— Turno ${S.turn}: ${S.players.map((p,i)=>`${p.name} bajó #${picks[i].id}`).join(' · ')}`);
  picks.forEach(c=>giveClients(c));
  S.selCard = null;
  runBonuses(()=>afterReveal());
}

function afterReveal(){
  // Inauguración: el jugador inicial de los turnos 1 y 2 de la ronda 1 recibe 1 extra
  if(S.round===1 && S.inaug && S.turn<=2) S.players[S.start].extras += 1;

  // Criterios en simultáneo: al llegar a la tercera carta, todos eligen en orden desde el jugador inicial
  if(S.simPick){
    if(!S.simDone && S.players.some(p=>p.street.length>=3)){
      S.simDone=true;
      startSimPick();
      return;
    }
    finishTurn(null);
    return;
  }

  if(S.round>1 && S.n>=4 && S.turn===1){ finishTurn(null); return; }
  const pickLimit = S.round===1 ? lastPickTurn() : 3;
  if(S.turn<=pickLimit){
    const st = S.players[S.start];
    if(st.human){
      S.pendingPick = true;
      log('Sos jugador inicial: elegí un criterio nuevo.');
      render();
      return;
    }
    const crit = botCrit(st);
    log(`${st.name} elige el criterio ${LBL[crit]}.`);
    finishTurn(crit);
  } else {
    finishTurn(null);
  }
}

function startSimPick(){
  S.simQueue = [...Array(S.n).keys()].map(i=>(S.start+i)%S.n);
  log('Elegir criterios en simultáneo: cada jugador elige, en orden desde el jugador inicial.');
  runSimQueue();
}

// Avanza la cola: los bots eligen solos; cuando llega el turno del jugador, se detiene y espera su elección.
function runSimQueue(){
  while(S.simQueue.length){
    const p = S.players[S.simQueue[0]];
    if(p.human){
      S.pendingPick = true;
      log('Elegí tu criterio de puntuación.');
      render();
      return;
    }
    const crit = botCrit(p);
    S.active.push(crit);
    S.simQueue.shift();
    log(`${p.name} elige el criterio ${LBL[crit]}.`);
  }
  S.pendingPick = false;
  finishTurn(null);
}

function pickCriterion(crit){
  if(S.prePick){
    S.prePick=false;
    S.active.push(crit);
    log(`Criterio elegido antes de empezar: ${LBL[crit]}.`);
    render();
    return;
  }
  if(!S.pendingPick) return;
  if(!pickablePool().includes(crit)) return;
  if(S.simQueue.length){
    S.active.push(crit);
    S.simQueue.shift();
    S.pendingPick = false;
    log(`Criterio nuevo: ${LBL[crit]}.`);
    runSimQueue();
    return;
  }
  log(`Criterio nuevo: ${LBL[crit]}.`);
  finishTurn(crit);
}

// Después de bajar y elegir criterio: los bots descartan en silencio y roban 2; vos elegís qué descartar.
// En el último turno de la ronda no hay descarte.
function finishTurn(crit){
  if(crit) S.active.push(crit);
  S.pendingPick = false;
  S.players.filter(p=>!p.human).forEach(botExtras);
  runBonuses(null);
  S.start = (S.start+1) % S.n;

  if(S.turn>=S.totalTurns){ completeTurn(); return; }
  S.players.filter(p=>!p.human).forEach(p=>{
    discardFrom(p, botDiscard(p));
    drawCards(p,2);
  });
  S.pendingDiscard = true;
  render();
}

function placeExtra(card){
  const me = S.players[0];
  if(me.extras<=0){ log('No te quedan clientes extra.'); render(); return; }
  if(card.clients>=capOf(card)){ log('Ese local ya está lleno.'); render(); return; }
  card.clients++;
  if(card.clients===capOf(card)) S.newFull.push(card);
  me.extras--;
  if(me.extras===0) S.extraMode=false;
  runBonuses(null);
  render();
}

function score(){
  const pts = S.players.map(()=>0);
  const lines = [];
  const keys = [...S.active];
  if(S.extraClients) keys.push('_TOT');
  keys.forEach(crit=>{
    const vals = S.players.map((p,i)=>({i, v: crit==='_TOT' ? totalClients(p) : p.street.filter(c=>has(c,crit)).reduce((s,c)=>s+c.clients,0)}));
    vals.sort((a,b)=>b.v-a.v);
    let pos=0;
    while(pos<vals.length && vals[pos].v>0){
      let k=pos;
      while(k<vals.length && vals[k].v===vals[pos].v) k++;
      const group = vals.slice(pos,k);
      let sum=0;
      for(let q=pos;q<k && q<3;q++) sum+=SLOTS[q];
      const avg = Math.floor(sum/group.length);
      group.forEach(g=>pts[g.i]+=avg);
      lines.push({crit, group: group.map(g=>({name:S.players[g.i].name, v:g.v, pts:avg}))});
      pos=k;
    }
  });
  return {pts, lines};
}

function endRound(){
  S.over = true;
  S.hideOverlay = false;
  const res = score();
  res.pts.forEach((v,i)=>S.totalPts[i]+=v);
  S.roundResults.push(res);
  if(S.players[0].extras>0) log(`Te quedaron ${S.players[0].extras} clientes extra sin colocar.`);
  log(`Fin de la ronda ${S.round}.`);
  render();
}

// Conserva los 2 locales más recientes de cada vereda que tengan lugar libre y al menos una ficha colocada.
// El resto de las cartas (veredas, manos y descarte) vuelve al mazo, se mezcla y se reparten manos nuevas.
function nextRound(){
  S.players.forEach(p=>p.street.forEach(c=>{ c.bonusMark=false; }));
  const kept = new Set();
  S.players.forEach(p=>{
    let n=0;
    for(let i=p.street.length-1; i>=0 && n<2; i--){
      const c=p.street[i];
      if(c.clients<capOf(c) && c.clients>=1){ kept.add(c); n++; }
    }
  });
  const back = [];
  S.players.forEach(p=>{
    p.street.forEach(c=>{ if(!kept.has(c)) back.push(c.id); });
    p.hand.forEach(c=>back.push(c.id));
    p.street = p.street.filter(c=>kept.has(c));
    p.hand = [];
  });
  S.deck = shuffle([...S.deck, ...S.discard, ...back.map(rowOf)]);
  S.discard = [];
  S.players.forEach(p=>{ for(let i=0;i<handSize();i++) p.hand.push(mkCard(S.deck.pop(),p)); });
  S.round++;
  beginRound();
}

/* ===== RENDER ===== */
function cardHTML(c, cls=''){
  const cp = capOf(c);
  const slots = SLOTS_ART[c.s];
  const dots = Array.from({length:cp},(_,i)=>{
    const [x,y] = slots[i];
    return `<i class="dot ${i<c.clients?'on':''}" style="left:${x}%;top:${y}%"></i>`;
  }).join('');
  const sel = (S.selCard===c ? ' sel' : '') + (S.discardSel===c ? ' dsel' : '');
  const front = S.front===c.id ? ' style="z-index:20"' : '';
  return `<div class="card ${cls}${sel}${c.bonusMark?' bonusmark':''}${isBonusTarget(c)?' bonus':''}" data-card="${c.id}"${front}>
    <img class="art" src="${cardSrc(c)}" alt="">
    ${dots}
    ${c.angry?'<div class="angry">−1</div>':''}
  </div>`;
}

function isPicking(){ return !!S && !S.over && (S.pendingPick || S.prePick); }

function losetaHTML(){
  const ok = isPicking() ? pickablePool() : [];
  const item = (code) => {
    const isPick = ok.includes(code);
    const act = S && S.active.includes(code) ? ' act' : '';
    return `<div class="lg${act}${isPick?' pick':''}" ${isPick?`data-crit="${code}"`:''}>${iconImg(code)}<span>${LBL[code]}</span></div>`;
  };
  return ['Ma','Ta','No','Pe','Me','Gr','Ba','Co','El','Ju','Ro'].map(item).join('');
}

      <p>Abrí locales en la cuadra, atraé clientes y ganá la mayoría en los criterios de puntuación que se activan en cada ronda.</p>
      <h4>Paso a paso</h4>
      <ul>
        <li>Por defecto: 4 jugadores (vos y 3 bots), 3 rondas y criterios iniciales por horario: ronda 1 mañana, ronda 2 tarde y ronda 3 noche.</li>
        <li>Cada turno, todos bajan una carta a la vez y se revelan en simultáneo. Cada carta da 1 cliente a los locales de la mesa que cumplan con su mismo atributo (tamaño, horario o rubro).</li>
        <li>Cuando un jugador tiene 3 cartas en su vereda, todos eligen un criterio de puntuación en orden desde el jugador inicial. En el modo Por Horario, el criterio elegido es de tamaño o rubro.</li>
        <li>Después de cada turno, descartás una carta en secreto y robás dos.</li>
        <li>Un local Pequeño o Mediano lleno da un cliente extra a otro local del mismo rubro de tu vereda.</li>
        <li>Al final de cada ronda, cada criterio da 5, 3 y 1 puntos a los tres jugadores con más clientes. El Bonus de Clientela suma un criterio más por total de clientes.</li>
        <li>Entre rondas, conservás tus 2 locales más recientes que tengan lugar libre y al menos una ficha.</li>
      </ul>
      <a href="${MANUAL}" target="_blank" rel="noopener">Ver el manual completo</a>
    </div>
    <div class="setup-right">
      <div class="opt-label">Jugadores (bots)</div>
      <div class="opt-desc">3 jugadores: mano de 5, 6 cartas por ronda. 4 jugadores: mano de 5, 5 cartas por ronda. 5 jugadores: mano de 4, 5 cartas por ronda. Los locales siempre tienen capacidad 4/5/6.</div>
      <div class="opts">${opt('rivals',2,'3 jugadores')}${opt('rivals',3,'4 jugadores')}${opt('rivals',4,'5 jugadores')}</div>
      <div class="opt-label">Dificultad de los bots</div>
      <div class="opt-desc">Difícil: el bot cuenta las cartas visibles, evita darles clientes a los rivales y prioriza los criterios activos. Fácil: el bot solo mira su mano y juega al azar.</div>
      <div class="opts">${opt('diff','dificil','Difícil')}${opt('diff','facil','Fácil')}</div>
      <div class="opt-label">Empieza</div>
      <div class="opt-desc">Quién es el jugador inicial de la primera ronda.</div>
      <div class="opts">${opt('starter','azar','Al azar')}${opt('starter','yo','Yo')}</div>
      <div class="opt-label">Ver puntuación en vivo</div>
      <div class="opt-desc">Muestra los puntos de cada jugador y el detalle de cada criterio mientras se juega.</div>
      <div class="opts">${opt('live',true,'Sí')}${opt('live',false,'No')}</div>
      <div class="opt-label">Número de rondas</div>
      <div class="opt-desc">1 ronda según el manual. 2 o 3 rondas: al terminar una, cada jugador conserva sus 2 locales más recientes que tengan lugar libre y al menos una ficha colocada, y el resto vuelve al mazo.</div>
      <div class="opts">${opt('rounds',1,'1')}${opt('rounds',2,'2')}${opt('rounds',3,'3')}</div>
      <div class="opt-label">Modo de criterios iniciales</div>
      <div class="opt-desc">Criterios iniciales al azar: 2 criterios sorteados al empezar. Por Horario: en cada ronda, el horario de esa ronda (mañana, tarde, noche). En ambos casos, cada jugador elige uno más en el tercer turno.</div>
      <div class="opts">${opt('critMode','horario','Por Horario')}${opt('critMode','azar','Criterios iniciales al azar')}</div>
      <div class="opt-label">Clientes en cadena</div>
      <div class="opt-desc">Un edificio Pequeño o Mediano lleno da un cliente extra a otro edificio del mismo rubro de tu vereda, de cualquier tamaño</div>
      <div class="opts">${opt('chainBonus',true,'Sí')}${opt('chainBonus',false,'No')}</div>
      <div class="opt-label">Bonus de Clientela</div>
      <div class="opt-desc">Puntuación Extra por mayoría de clientes 5/3/1</div>
      <div class="opts">${opt('extraClients',true,'Sí')}${opt('extraClients',false,'No')}</div>
      <input id="nm" placeholder="Tu nombre" value="${SETUP.name.replace(/"/g,'&quot;')}" maxlength="16">

}

function roundTableHTML(res){
  const rows = S.players.map((p,i)=>`<tr><td>${p.name}</td><td>${res.pts[i]}</td><td>${S.totalPts[i]}</td></tr>`).join('');
  const detail = res.lines.map(l=>`${LBL[l.crit]}: `+l.group.map(g=>`${g.name} (${g.v} cl., +${g.pts})`).join(' · ')).join('<br>');
  return `<table><tr><th>Jugador</th><th>Ronda</th><th>Total</th></tr>${rows}</table>
    <h4>Detalle</h4><div class="log" style="max-height:none">${detail || 'Nadie puntuó.'}</div>`;
}

function liveHTML(){
  const res = score();
  const keys = [...S.active, ...(S.extraClients?['_TOT']:[])];
  const rows = keys.map(crit=>{
    const parts = res.lines.filter(l=>l.crit===crit);
    return `<div><b>${LBL[crit]}:</b> ${parts.length? parts.map(l=>l.group.map(g=>`${g.name} (${g.v} cl., +${g.pts})`).join(' · ')).join(' | ') : '<i>nadie puntúa aún</i>'}</div>`;
  }).join('');
  return `<div class="panel"><b>Puntuación en vivo (ronda ${S.round})</b><div class="log" style="max-height:none;margin-top:6px">${rows}</div></div>`;
}

function render(){
  const app = document.getElementById('app');
  const hdr = document.getElementById('hdr');
  const picking = isPicking();
  document.getElementById('loseta').innerHTML = `<div class="loseta${picking?' glow':''}">${losetaHTML()}</div>`;
  if(!S){
    hdr.innerHTML = '';
    app.innerHTML = setupHTML();
    const nm = document.getElementById('nm');
    if(nm) nm.addEventListener('input', e=>{ SETUP.name = e.target.value; });
    return;
  }
  hdr.innerHTML = `<span class="chip">Ronda ${S.round} / ${S.rounds}</span>
    <span class="chip">Turno ${Math.min(S.turn,S.totalTurns)} / ${S.totalTurns}</span>
    <span class="chip">Mazo: ${S.deck.length}</span>
    <span class="chip">Inicial: ${S.players[S.start].name}</span>
    <button class="ghost" data-act="live" style="margin:0">Puntuación en vivo: ${S.live?'sí':'no'}</button>`;

  const me = S.players[0];
  const needDiscard = !S.over && S.pendingDiscard;
  const needPlay = !S.over && !picking && !needDiscard && !S.pendingBonus;

  let html = '';
  let handHTML = '';
  if(S.pendingBonus) html += `<div class="banner">Clientes en cadena: elegí en qué edificio de ${LBL[S.pendingBonus.src.r]} sumar el cliente extra</div>`;
  else if(needDiscard) html += `<div class="banner">Descartá una carta de tu mano: después robás 2</div>`;
  else if(S.prePick) html += `<div class="banner">Antes de empezar, elegí un criterio: tocá un ícono verde de arriba</div>`;
  else if(S.pendingPick && S.simQueue.length) html += `<div class="banner">Elegí tu criterio de puntuación: tocá un ícono verde de arriba</div>`;
  else if(S.pendingPick) html += `<div class="banner">Elegí un criterio nuevo: tocá un ícono verde de arriba</div>`;
  else if(needPlay && !S.selCard) html += `<div class="banner">Elegí una carta de tu mano</div>`;
  else if(needPlay && S.selCard) html += `<div class="banner">Bajá la carta elegida</div>`;

  S.players.forEach(p=>{
    html += `<div class="street"><h3><span>${p.name}${p.human?' (vos)':''}${S.live?` · ${score().pts[S.players.indexOf(p)]} pts`:''}</span><span class="tot">${p.street.length} locales · ${totalClients(p)} clientes totales${p.human && p.extras?` · extras: ${p.extras}`:''}</span></h3>
      <div class="row">${p.street.length ? p.street.map(c=>cardHTML(c, (p.human && S.extraMode && c.clients<capOf(c))?'ext':'')).join('') : '<span class="empty">Sin locales aún</span>'}</div></div>`;
  });

  if(!S.over){
    const handGlow = needDiscard ? ' glowred' : ((needPlay && !S.selCard) ? ' glow' : '');
    handHTML = `<div class="street handdock${handGlow}"><h3><span>Tu mano</span><span>${needDiscard?(S.discardSel?'Elegida para descartar #'+S.discardSel.id:'Tocá la carta que querés descartar'):(S.selCard?'Elegida #'+S.selCard.id:'Elegí una carta')}</span></h3>
      <div class="row handrow">${me.hand.map(c=>cardHTML(c,'hand')).join('')}</div>
      <div>
        ${needDiscard ? `<button class="danger${S.discardSel?' glowbtn':''}" data-act="confirmDiscard" ${S.discardSel?'':'disabled'}>Confirmar descarte</button>` : ''}
        <button data-act="play" class="${needPlay && S.selCard?'glowbtn':''}" ${(!S.selCard || !needPlay)?'disabled':''}>Bajar carta</button>
        <button class="alt" data-act="extra" ${(me.extras<=0 || !needPlay)?'disabled':''}>${S.extraMode?'Cancelar colocar':'Colocar cliente extra'} (${me.extras})</button>
      </div></div>`;
  } else {
    const res = S.roundResults[S.roundResults.length-1];
    const isLast = S.round >= S.rounds;
    html += `<div class="panel"><b>Ronda ${S.round} terminada</b><div style="margin-top:6px">
      <button class="ghost" data-act="showscore">Ver puntuación</button>
      ${isLast ? '<button data-act="new">Nueva partida</button>' : '<button data-act="nextround">Siguiente ronda</button>'}</div></div>`;
    if(!S.hideOverlay){
      html += `<div class="overlay"><div class="panel">
        <h3>${S.rounds===1 || isLast ? 'Puntuación final' : `Ronda ${S.round} terminada`}</h3>
        ${roundTableHTML(res)}
        <div style="margin-top:8px">
          <button class="ghost" data-act="viewtable">Ver mesa</button>
          ${S.rounds===1 || isLast ? '<button data-act="new">Nueva partida</button>' : '<button data-act="nextround">Siguiente ronda</button>'}
        </div></div></div>`;
    }
  }

  html += `<div class="infos">${S.live && !S.over ? liveHTML() : ''}<div class="panel"><b>Registro</b><div class="log" id="logbox">${S.log.slice(-40).map(l=>`<div>${l}</div>`).join('')}</div></div></div>`;
  app.innerHTML = html + handHTML;
  const logEl = document.getElementById('logbox');
  if(logEl) logEl.scrollTop = logEl.scrollHeight;
}

/* ===== EVENTOS ===== */
document.addEventListener('click', e=>{
  // Elegir criterio tocando un ícono verde de la loseta
  const crit = e.target.closest('[data-crit]');
  if(crit && S && !S.over){ pickCriterion(crit.dataset.crit); return; }

  const opt = e.target.closest('[data-opt]');
  if(opt){
    const k = opt.dataset.opt;
    const raw = opt.dataset.val;
    let v;
    if(raw==='true') v=true; else if(raw==='false') v=false; else if(raw!=='' && !isNaN(raw)) v=+raw; else v=raw;
    SETUP[k] = v;
    render();
    return;
  }
  const act = e.target.closest('[data-act]');
  if(act){
    const a = act.dataset.act;
    if(a==='start'){ newGame(); return; }
    if(a==='new'){ S = null; render(); return; }
    if(!S) return;
    if(a==='live'){ S.live = !S.live; render(); return; }
    if(a==='viewtable'){ S.hideOverlay=true; render(); return; }
    if(a==='showscore'){ S.hideOverlay=false; render(); return; }
    if(a==='nextround'){ nextRound(); return; }
    if(S.over) return;
    if(a==='play' && S.selCard && !S.pendingPick && !S.prePick && !S.pendingDiscard && !S.pendingBonus){ doTurn(S.selCard.id); return; }
    if(a==='extra'){ S.extraMode = !S.extraMode; render(); return; }
    if(a==='confirmDiscard'){ confirmDiscard(); return; }
  }
  const cardEl = e.target.closest('[data-card]');
  if(cardEl && S && !S.over){
    const id = +cardEl.dataset.card;
    const me = S.players[0];
    S.front = id;
    if(S.pendingBonus){
      const bt = me.street.find(c=>c.id===id);
      if(bt) chooseBonus(bt);
      return;
    }
    if(S.pendingDiscard){
      const dc = me.hand.find(c=>c.id===id);
      if(dc){ S.discardSel = dc; render(); }
      return;
    }
    if(S.extraMode){
      const own = me.street.find(c=>c.id===id);
      if(own) placeExtra(own);
      return;
    }
    if(S.pendingPick || S.prePick) return;
    const hc = me.hand.find(c=>c.id===id);
    if(hc) S.selCard = hc;
    render();
  }
});

render();
</script>
