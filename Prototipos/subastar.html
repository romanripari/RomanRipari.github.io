<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subastar · prototipo</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#23252b;color:#f3f3f3;font-family:system-ui,"Segoe UI",Arial,sans-serif;font-size:14px}
header{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px;flex-wrap:wrap}
h1{font-size:18px;margin:0 10px 0 0}
button,select{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid #555;background:#3b3f49;color:#f3f3f3;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
#holder{position:relative;margin:0 auto}
#stage{position:absolute;left:0;top:0;width:1200px;height:760px;transform-origin:0 0}
.card{width:66px;height:102px;border-radius:5px;background-repeat:no-repeat;background-size:900% 500%;box-shadow:0 2px 5px #0009;display:inline-block;vertical-align:top}
.card.mini{width:26px;height:40px;border-radius:3px;margin:1px}
.spot{position:absolute;transform:translate(-50%,-50%);width:240px;text-align:center;background:rgba(0,0,0,.28);border-radius:12px;padding:8px}
.spot.cen{width:230px}
.spot .row{display:flex;gap:8px;justify-content:center}
.seat{position:absolute;transform:translate(-50%,-50%);width:230px;background:#2f323a;border-radius:12px;padding:8px}
.seat .nm{font-weight:700;margin-bottom:4px}
.seat .zone{max-height:84px;overflow:hidden;min-height:20px}
.seat .hand{margin-top:4px;min-height:24px}
.lbl{font-size:12px;color:#c4c8d2;margin-top:4px}
.hier{font-size:12px;color:#c4c8d2;margin-top:6px;display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap}
.tok{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-weight:700;margin:2px;font-size:12px;color:#111}
.isp{display:inline-block;background-repeat:no-repeat;background-size:100% 600%;vertical-align:middle;margin:1px}
.card.bad{outline:3px solid #ff1a1a;outline-offset:1px;box-shadow:0 0 10px 3px #ff1a1a}
#controls{width:min(1200px,96vw);margin:8px auto;background:#2f323a;border-radius:12px;padding:12px}
.zones{display:flex;flex-direction:column;gap:8px}
.zrow{background:#23252b;border-radius:10px;padding:10px;display:grid;grid-template-columns:200px 1fr;gap:10px;align-items:center}
.zrow .fl{font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:2px solid transparent;border-radius:999px;padding:4px 10px;background:#e6e6e6;color:#111;cursor:pointer;font-size:13px}
.chip.sel{border-color:#fff;box-shadow:0 0 0 2px #0a0}
.chip.used{opacity:.35}
.chip.type.magenta,.chip.type.celeste{color:#fff}
.log{margin-top:10px;font-size:13px;line-height:1.5;max-height:200px;overflow:auto}
.msg{color:#ffb4a2;min-height:18px;margin-top:6px}
table{border-collapse:collapse;margin-top:6px}
td,th{padding:4px 12px;border-bottom:1px solid #444;text-align:left}
</style>
</head>
<body>
<header>
  <h1>Subastar · prototipo</h1>
  <label>Jugadores
    <select id="np"><option value="3">3 (vos + 2 bots)</option><option value="4">4 (vos + 3 bots)</option><option value="5" selected>5 (vos + 4 bots)</option></select>
  </label>
  <button onclick="start()">Nueva partida</button>
</header>

<div id="holder"><div id="stage"></div></div>
<div id="controls">Elegí la cantidad de jugadores y empezá.</div>

<script>
const COLS=9, ROWS=5;
// Nombres de Paseo Comercial. Los bots toman nombres al azar en cada partida.
const PLAYER_NAMES=['Lucía','Ana','Patri','Sofía','Carla','Laura','Julián','Bruno','Lucho','Nahuel','Augusto','Ale','Joaco','Gonza','Quimey','Facu','Pepo','Fer','Lito','Caco','Alf','Leo'];
const COLOR_NAMES=['Naranja','Verde','Amarillo','Violeta','Gris'];
const PATTERN=[[4,'+'],[4,'-'],[5,'-'],[3,'+'],[2,null],[1,null],[3,'-'],[2,'-'],[1,null]];
// Prioridad de tipos (Y=Amarillo, C=Celeste, M=Magenta) leída del reverso de cada carta.
const BACKS=[
 'YMC CYM MCY YCM CYM CMY MYC MCY YMC',
 'MCY CYM YCM CMY MCY CMY YCM MYC YMC',
 'YMC MCY CYM YMC MYC YCM CYM CMY MYC',
 'YCM CMY MCY CMY YMC YMC MYC MCY CYM',
 'YCM MYC MYC YCM CMY CMY MYC YCM CMY'
];
const TYPES=['Y','C','M'];
const TNAME={Y:'Amarillo',C:'Celeste',M:'Magenta'};
const TCOL={Y:'#FFE800',C:'#00A0E3',M:'#E6007E'};
const PERMS=[['Y','C','M'],['Y','M','C'],['C','Y','M'],['C','M','Y'],['M','Y','C'],['M','C','Y']];
const CFG={3:{L:8,C:15},4:{L:7,C:13},5:{L:6,C:11}};
const FRONTS=[['L','Izquierda'],['C','Centro'],['R','Derecha']];
// Estrellas por ficha de Intensidad
const STARS_INT={0:0,20:1,40:2,60:2,80:3,100:3};

let S=null;
const $=s=>document.querySelector(s);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
const fmt=v=>v?v+'%':'vacía';
const starsOfInt=v=>STARS_INT[v]||0;
const cardName=c=>`${c.color} ${c.stars}★${c.pol?' ('+c.pol+')':''}`;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function makeDeck(){
  const out=[];
  for(let r=0;r<ROWS;r++){
    const bk=BACKS[r].split(' ');
    for(let c=0;c<COLS;c++){
      const [stars,pol]=PATTERN[c];
      out.push({r,c,stars,pol,color:COLOR_NAMES[r],back:bk[c]});
    }
  }
  return out;
}

// Sprite: la hoja de 9x5 se muestra recortando la celda correspondiente.
function cardEl(card,back,cls){
  const d=el('div','card'+(cls?' '+cls:''));
  d.style.backgroundImage=`url("Cartas/${back?'Reversos':'Anversos'}.png")`;
  d.style.backgroundPosition=`${card.c*12.5}% ${card.r*25}%`;
  return d;
}
function tokenEl(kind,v){
  if(kind==='I') return intSprite(v,46);
  const d=el('div','tok');
  if(kind==='T'){d.style.background=TCOL[v];d.style.color=v==='Y'?'#111':'#fff';d.textContent=TNAME[v].slice(0,1);d.title=TNAME[v];}
  else{d.classList.add('int');d.textContent=fmt(v);}
  return d;
}
// Fichas de intensidad: columna de 6 filas (0%, 20%, 40%, 60%, 80%, 100%) en Cartas/Intensidades.png
const INT_ROW={0:0,20:1,40:2,60:3,80:4,100:5};
function intSprite(v,w){
  const d=el('div','isp');
  d.style.width=w+'px';
  d.style.height=(w*0.98)+'px';
  d.style.backgroundImage='url("Cartas/Intensidades.png")';
  d.style.backgroundPosition=`0% ${INT_ROW[v]*20}%`;
  d.title=fmt(v);
  return d;
}
function hierEl(h){
  const d=el('div','hier');
  d.appendChild(document.createTextNode('Prioridad:'));
  for(const ch of h) d.appendChild(tokenEl('T',ch));
  return d;
}

function newGame(n){
  const deck=shuffle(makeDeck());
  const L=CFG[n].L, C=CFG[n].C;
  S={n,players:[],laterals:[],center:[],pool:[],cInt:0,round:0,box:[],log:[],rev:null,phase:'bid',steps:[],stepIdx:0,ended:false,pick:null,msg:''};
  const nombres=shuffle([...PLAYER_NAMES]);
  for(let i=0;i<n;i++) S.players.push({name:i===0?'Tú':nombres[i-1],human:i===0,zone:[],hand:[20,40,60,80,100],bid:null});
  for(let i=0;i<n;i++) S.laterals.push(deck.splice(0,L));
  S.center=deck.splice(0,C);
  startRound();
}

// Revela dos cartas en el centro (primero las que quedaron en el medio, después del mazo).
// Si entre ellas hay (+) y (−) del mismo color, ambas se mezclan en el mazo central y salen dos nuevas.
function findPair(mid){
  if(mid.length<2) return null;
  const [a,b]=mid;
  if(a.color===b.color&&a.pol&&b.pol&&a.pol!==b.pol) return [a,b];
  return null;
}
function centerReveal(){
  let mid=[];
  const take=()=>{ if(S.pool.length) return S.pool.shift(); if(S.center.length) return S.center.pop(); return null; };
  while(mid.length<2){ const c=take(); if(!c) break; mid.push(c); }
  for(;;){
    const pr=findPair(mid);
    if(!pr) break;
    S.center.push(pr[0],pr[1]);
    shuffle(S.center);
    S.log.push(`Incompatibilidad en el centro (${cardName(pr[0])} / ${cardName(pr[1])}): se mezclan y salen dos cartas nuevas`);
    mid=[];
    while(mid.length<2&&S.center.length) mid.push(S.center.pop());
  }
  return mid;
}

function startRound(){
  S.round++;
  S.log=[];
  S.phase='bid';
  S.steps=[];
  S.msg='';
  S.pick={L:{t:null,i:null},C:{t:null,i:null},R:{t:null,i:null}};
  S.rev={lat:[],cen:null};
  for(let i=0;i<S.n;i++){
    const d=S.laterals[i];
    const card=d.pop();
    S.rev.lat.push({card,hier:d[d.length-1].back});
  }
  const cards=centerReveal();
  const hier=S.center.length?S.center[S.center.length-1].back:shuffle([...TYPES]).join('');
  S.rev.cen=cards.length?{cards,hier}:null;
  S.players.forEach(p=>p.bid=null);
  S.players.forEach((p,i)=>{ if(!p.human) placeBid(i,botChoose(i)); });
  render();
}

function placeBid(i,bid){
  const p=S.players[i];
  p.bid=bid;
  for(const f of ['L','R','C']){
    const idx=p.hand.indexOf(bid[f].v);
    p.hand.splice(idx,1);
  }
}

function botChoose(i){
  const p=S.players[i];
  const n=S.n;
  const h={L:S.rev.lat[(i-1+n)%n].hier,R:S.rev.lat[i].hier,C:S.rev.cen?S.rev.cen.hier:'YCM'};
  let best=null,bs=-1e9;
  for(const pm of PERMS){
    const sc=(3-h.L.indexOf(pm[0]))+(3-h.R.indexOf(pm[1]))+(3-h.C.indexOf(pm[2]))+Math.random()*2.5;
    if(sc>bs){bs=sc;best=pm;}
  }
  const hand=[...p.hand].sort((a,b)=>b-a);
  const cv=hand[0];
  const rest=hand.slice(1);
  const pick=()=>rest.splice(Math.floor(Math.random()*rest.length),1)[0];
  const lv=pick(), rv=pick();
  return {L:{t:best[0],v:lv},R:{t:best[1],v:rv},C:{t:best[2],v:cv}};
}

// Duelo lateral: 1 si gana a, -1 si gana b, 0 si empate total.
function duel2(a,b,hier){
  const ra=hier.indexOf(a.t), rb=hier.indexOf(b.t);
  if(ra!==rb) return ra<rb?1:-1;
  if(a.v!==b.v) return a.v>b.v?1:-1;
  return 0;
}

function resolveRound(){
  S.phase='resolve';
  S.steps=[];
  S.incCount=0;
  for(let i=0;i<S.n;i++){
    const j=(i+1)%S.n;
    S.steps.push({t:'lat',i,label:`Resolver lateral ${i+1} (${S.players[i].name} vs ${S.players[j].name})`});
  }
  if(S.rev.cen) S.steps.push({t:'cen',label:`Resolver centro (${S.rev.cen.cards.map(cardName).join(' y ')})`});
  S.steps.push({t:'inc',label:'Revisar incompatibilidades'});
  S.stepIdx=0;
  render();
}

function doStep(){
  const st=S.steps[S.stepIdx];
  if(st.t==='inc'){
    const pr=findIncPairs();
    if(pr.length){ resolveOneInc(pr[0]); render(); return; }
    S.log.push(S.incCount?'Incompatibilidades resueltas.':'Sin incompatibilidades en las zonas personales.');
  }
  else if(st.t==='lat') doLateral(st.i);
  else doCenter();
  S.stepIdx++;
  if(S.stepIdx>=S.steps.length){
    S.phase='done';
    S.ended=S.laterals.some(d=>d.length<2);
  }
  render();
}

function doLateral(i){
  const P=S.players, j=(i+1)%S.n;
  const A=P[i], B=P[j];
  const a=A.bid.R, b=B.bid.L, rv=S.rev.lat[i];
  const cw=duel2(a,b,rv.hier);
  // Las fichas de intensidad se cambian siempre entre los dos jugadores del duelo
  A.hand.push(b.v); B.hand.push(a.v);
  let res;
  if(cw===1){A.zone.push(rv.card);res=`gana ${A.name}`;}
  else if(cw===-1){B.zone.push(rv.card);res=`gana ${B.name}`;}
  else{S.box.push(rv.card);res='empate total: la carta se descarta';}
  S.log.push(`Lateral ${i+1}: ${A.name} (${TNAME[a.t]} ${fmt(a.v)}) vs ${B.name} (${TNAME[b.t]} ${fmt(b.v)}) → ${res}`);
}

// Centro: un solo duelo entre todos; quien gana se lleva las dos cartas.
function doCenter(){
  const P=S.players;
  const cards=S.rev.cen.cards, hier=S.rev.cen.hier;
  const key=i=>[hier.indexOf(P[i].bid.C.t),-P[i].bid.C.v];
  const cmp=(x,y)=>x[0]!==y[0]?x[0]-y[0]:x[1]-y[1];
  let rem=P.map((_,i)=>i), win=-1;
  while(rem.length){
    let best=key(rem[0]);
    rem.forEach(i=>{const k=key(i);if(cmp(k,best)<0)best=k;});
    const tied=rem.filter(i=>cmp(key(i),best)===0);
    if(tied.length===1){win=tied[0];break;}
    S.log.push(`Centro: empate entre ${tied.map(i=>P[i].name).join(', ')}, quedan fuera`);
    rem=rem.filter(i=>!tied.includes(i));
  }
  const names=cards.map(cardName).join(' y ');
  if(win>=0){
    const W=P[win], used=W.bid.C.v;
    cards.forEach(c=>W.zone.push(c));  // se lleva las dos cartas
    W.hand.push(S.cInt);               // se lleva la ficha que estaba en el centro
    P.forEach((p,i)=>{if(i!==win)p.hand.push(p.bid.C.v);});
    S.cInt=used;                       // deja la ficha usada en el centro
    S.log.push(`Centro (${names}): gana ${W.name} con ${TNAME[W.bid.C.t]} ${fmt(W.bid.C.v)} y se lleva las dos cartas`);
  }else{
    cards.forEach(c=>S.box.push(c));
    P.forEach(p=>p.hand.push(p.bid.C.v));
    S.log.push('Centro: sin ganador, las cartas se descartan');
  }
}

// Incompatibilidades pendientes: un (+) y un (−) del mismo color en la misma zona personal.
function findIncPairs(){
  const out=[];
  S.players.forEach(p=>COLOR_NAMES.forEach(col=>{
    const pl=p.zone.find(c=>c.color===col&&c.pol==='+');
    const mi=p.zone.find(c=>c.color===col&&c.pol==='-');
    if(pl&&mi) out.push({p,pl,mi});
  }));
  return out;
}
// Resuelve una sola incompatibilidad: el (+) se retira y el (−) va al medio.
function resolveOneInc({p,pl,mi}){
  p.zone.splice(p.zone.indexOf(pl),1);
  p.zone.splice(p.zone.indexOf(mi),1);
  S.box.push(pl);
  S.pool.push(mi);
  S.incCount=(S.incCount||0)+1;
  S.log.push(`${p.name}: incompatibilidad en ${pl.color} (+ ${pl.stars}★ / − ${mi.stars}★): se retira el (+) y el (−) va al medio`);
}
// Fase 4 (versión anterior, sin uso): incompatibilidades en la zona personal de cada jugador.
function doIncompat(){
  let any=false;
  S.players.forEach(p=>{
    COLOR_NAMES.forEach(col=>{
      for(;;){
        const pl=p.zone.find(c=>c.color===col&&c.pol==='+');
        const mi=p.zone.find(c=>c.color===col&&c.pol==='-');
        if(!pl||!mi) break;
        p.zone.splice(p.zone.indexOf(pl),1);
        p.zone.splice(p.zone.indexOf(mi),1);
        S.box.push(pl);
        S.pool.push(mi);
        any=true;
        S.log.push(`${p.name} tiene incompatibles en ${col}: se retira el (+) y el (−) va al medio`);
      }
    });
  });
  if(!any) S.log.push('Sin incompatibilidades en las zonas personales.');
}

// Selección de la subasta: cada tipo y cada ficha de intensidad solo puede usarse en un frente.
function pickType(f,t){
  const other=FRONTS.map(x=>x[0]).find(g=>g!==f&&S.pick[g].t===t);
  if(other){ S.msg=`${TNAME[t]} ya está en ${FRONTS.find(x=>x[0]===other)[1]}.`; return renderControls(); }
  S.pick[f].t=S.pick[f].t===t?null:t;
  S.msg='';
  renderControls();
}
function pickInt(f,idx){
  const other=FRONTS.map(x=>x[0]).find(g=>g!==f&&S.pick[g].i===idx);
  if(other){ S.msg=`Esa ficha de ${fmt(S.players[0].hand[idx])} ya está en ${FRONTS.find(x=>x[0]===other)[1]}.`; return renderControls(); }
  S.pick[f].i=S.pick[f].i===idx?null:idx;
  S.msg='';
  renderControls();
}
function humanSubmit(){
  const h=S.players[0];
  const bid={};
  for(const [f] of FRONTS){
    const pk=S.pick[f];
    bid[f]={t:pk.t,v:h.hand[pk.i]};
  }
  placeBid(0,bid);
  resolveRound();
}

function zoneStars(p){return p.zone.reduce((s,c)=>s+c.stars,0);}
function handStars(p){return p.hand.reduce((s,v)=>s+starsOfInt(v),0);}

function render(){
  const st=$('#stage');
  st.innerHTML='';
  if(!S){renderControls();return;}
  const n=S.n;
  // Cartas en incompatibilidad (se marcan en rojo hasta resolverlas)
  const badSet=new Set(S.phase==='resolve'?findIncPairs().flatMap(x=>[x.pl,x.mi]):[]);
  // Laterales: entre cada jugador i y el de su derecha en pantalla
  for(let i=0;i<n;i++){
    const a=(90-(i+0.5)*360/n)*Math.PI/180;
    const x=600+260*Math.cos(a), y=330+150*Math.sin(a);
    const d=S.laterals[i];
    const rv=S.rev?S.rev.lat[i]:null;
    const spot=el('div','spot');
    spot.style.left=x+'px';spot.style.top=y+'px';
    const row=el('div','row');
    if(rv) row.appendChild(cardEl(rv.card,false,''));
    if(d.length) row.appendChild(cardEl(d[d.length-1],true,''));
    spot.appendChild(row);
    if(rv) spot.appendChild(hierEl(rv.hier));
    spot.appendChild(el('div','lbl',`${S.players[i].name} ↔ ${S.players[(i+1)%n].name} · mazo ${d.length}`));
    st.appendChild(spot);
  }
  // Centro: dos cartas reveladas
  {
    const spot=el('div','spot cen');
    spot.style.left='600px';spot.style.top='330px';
    const row=el('div','row');
    if(S.rev&&S.rev.cen) S.rev.cen.cards.forEach(c=>row.appendChild(cardEl(c,false,'')));
    if(S.center.length) row.appendChild(cardEl(S.center[S.center.length-1],true,''));
    spot.appendChild(row);
    if(S.rev&&S.rev.cen) spot.appendChild(hierEl(S.rev.cen.hier));
    spot.appendChild(el('div','lbl',`Centro · mazo ${S.center.length} · medio ${S.pool.length}`));
    const ct=el('div','hier'); ct.appendChild(document.createTextNode('Intensidad:')); ct.appendChild(tokenEl('I',S.cInt));
    spot.appendChild(ct);
    st.appendChild(spot);
  }
  // Asientos: el jugador 0 abajo; los siguientes van hacia la derecha de pantalla
  S.players.forEach((p,i)=>{
    const a=(90-i*360/n)*Math.PI/180;
    const x=600+420*Math.cos(a), y=330+240*Math.sin(a);
    const seat=el('div','seat');
    seat.style.left=x+'px';seat.style.top=y+'px';
    seat.appendChild(el('div','nm',`${p.name} · ★ ${zoneStars(p)}`));
    const zone=el('div','zone');
    p.zone.forEach(c=>zone.appendChild(cardEl(c,false,'mini'+(badSet.has(c)?' bad':''))));
    seat.appendChild(zone);
    const hand=el('div','hand');
    if(p.human) p.hand.forEach(v=>hand.appendChild(tokenEl('I',v)));
    else hand.textContent='';
    seat.appendChild(hand);
    st.appendChild(seat);
  });
  fit();
  renderControls();
}

function renderControls(){
  const c=$('#controls');
  c.innerHTML='';
  if(!S){c.textContent='Elegí la cantidad de jugadores y empezá.';return;}
  const n=S.n;
  const label=S.phase==='bid'?'tu subasta':S.phase==='resolve'?'resolución':S.ended?'fin de partida':'resultado de la ronda';
  c.appendChild(el('div','',`Ronda ${S.round} · ${label}`));

  if(S.phase==='bid'){
    const h=S.players[0];
    const hierOf={L:S.rev.lat[n-1].hier,C:S.rev.cen?S.rev.cen.hier:'YCM',R:S.rev.lat[0].hier};
    const sideName={L:`vs ${S.players[n-1].name}`,C:'todos',R:`vs ${S.players[1%n].name}`};
    const zones=el('div','zones');
    for(const [f,lab] of FRONTS){
      const pk=S.pick[f];
      const zr=el('div','zrow');
      const left=el('div','');
      left.appendChild(el('div','fl',`${lab} (${sideName[f]})`));
      left.appendChild(hierEl(hierOf[f]));
      zr.appendChild(left);
      const right=el('div','');
      const tRow=el('div','chips');
      tRow.appendChild(el('span','lbl','Tipo: '));
      for(const t of TYPES){
        const other=FRONTS.map(x=>x[0]).find(g=>g!==f&&S.pick[g].t===t);
        const ch=el('span',`chip type ${TNAME[t].toLowerCase()}${pk.t===t?' sel':''}${other?' used':''}`,TNAME[t]);
        ch.style.background=TCOL[t];
        ch.onclick=()=>pickType(f,t);
        tRow.appendChild(ch);
      }
      right.appendChild(tRow);
      const iRow=el('div','chips');
      iRow.style.marginTop='6px';
      iRow.appendChild(el('span','lbl','Intensidad: '));
      h.hand.forEach((v,idx)=>{
        const other=FRONTS.map(x=>x[0]).find(g=>g!==f&&S.pick[g].i===idx);
        const ch=el('span',`chip${pk.i===idx?' sel':''}${other?' used':''}`);
        ch.appendChild(intSprite(v,44));
        ch.onclick=()=>pickInt(f,idx);
        iRow.appendChild(ch);
      });
      right.appendChild(iRow);
      zr.appendChild(right);
      zones.appendChild(zr);
    }
    c.appendChild(zones);
    const ready=FRONTS.every(([f])=>S.pick[f].t&&S.pick[f].i!==null);
    const row=el('div','');
    row.style.marginTop='10px';
    row.style.display='flex';row.style.gap='10px';row.style.alignItems='center';
    const btn=el('button','',ready?'Subastar':'Falta elegir tipo e intensidad en los 3 frentes');
    btn.disabled=!ready;
    btn.onclick=()=>humanSubmit();
    row.appendChild(btn);
    c.appendChild(row);
    c.appendChild(el('div','msg',S.msg||''));
  }else{
    const t=document.createElement('table');
    t.innerHTML='<tr><th>Jugador</th><th>Izquierda</th><th>Centro</th><th>Derecha</th></tr>';
    S.players.forEach(p=>{
      const tr=document.createElement('tr');
      const cell=b=>b?`${TNAME[b.t]} ${fmt(b.v)}`:'';
      tr.innerHTML=`<td>${p.name}</td><td>${cell(p.bid.L)}</td><td>${cell(p.bid.C)}</td><td>${cell(p.bid.R)}</td>`;
      t.appendChild(tr);
    });
    c.appendChild(t);

    if(S.phase==='resolve'){
      const st=S.steps[S.stepIdx];
      let lab=st.label;
      if(st.t==='inc'){const k=findIncPairs().length; lab=k?`Resolver incompatibilidades (${k} pendientes)`:'Continuar';}
      const b=el('button','',lab);
      b.onclick=()=>doStep();
      const row=el('div','');row.style.marginTop='10px';row.appendChild(b);
      c.appendChild(row);
    }else if(S.ended){
      const rows=S.players.map(p=>({name:p.name,z:zoneStars(p),h:handStars(p),t:zoneStars(p)+handStars(p)})).sort((a,b)=>b.t-a.t);
      const tb=document.createElement('table');
      tb.innerHTML='<tr><th>Jugador</th><th>Cartas ★</th><th>Fichas ★</th><th>Total</th></tr>';
      rows.forEach(r=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${r.name}</td><td>${r.z}</td><td>${r.h}</td><td><b>${r.t}</b></td>`;tb.appendChild(tr);});
      c.appendChild(tb);
    }else{
      const b=el('button','','Siguiente ronda');
      b.onclick=()=>startRound();
      const row=el('div','');row.style.marginTop='10px';row.appendChild(b);
      c.appendChild(row);
    }
  }
  const log=el('div','log');
  (S.log||[]).forEach(l=>log.appendChild(el('div','',l)));
  c.appendChild(log);
}

function fit(){
  const s=Math.min(1,(innerWidth-24)/1200);
  const h=$('#holder');
  h.style.width=(1200*s)+'px';
  h.style.height=(760*s)+'px';
  $('#stage').style.transform=`scale(${s})`;
}
addEventListener('resize',fit);

function start(){
  newGame(+$('#np').value);
}
fit();
</script>
</body>
</html>
